(function (global) {
  'use strict';

  var KINDS = [
    { key: 'feature',       label: '이런 게 있으면 좋겠어요' },
    { key: 'inconvenience', label: '불편해요' },
    { key: 'bug',           label: '오류가 있어요' }
  ];
  var KIND_LABEL = { feature: '기능 요청', inconvenience: '불편', bug: '오류', info: '정책 정보' };
  var STATUS = { 'new': '접수됨', seen: '확인했어요', done: '반영했어요' };
  var CHANNEL = { chief: '이장에게', haru: '하루에게' };
  var COURIER = { chief: '🎩 이장이 운영팀 답을 전해 왔어요', haru: '하루가 운영팀 답을 전해 왔어요' };

  var LINES = {
    ask:      '마을에 바라는 점, 불편한 점, 오류를 알려 주세요. 운영팀(사람)이 읽고 답해요.',
    saved:    '운영팀에 전할게요. 답이 오면 휴대폰 "내 의견함"에서 볼 수 있어요.',
    many:     '오늘은 의견을 많이 보내 주셨어요. 내일 다시 보내 주세요.',
    crisis:   '많이 힘드신 것 같아요. 지금 바로 이야기할 수 있는 곳을 알려 드릴게요.',
    failed:   '지금은 의견을 받을 수 없어요. 조금 뒤에 다시 보내 주세요.',
    empty:    '아직 보낸 의견이 없어요.',
    loadFail: '의견함을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.',
    keep:     '보낸 의견은 90일 뒤 자동으로 지워져요. 운영팀에게는 이름 대신 번호로만 보여요.',
    noBody:   '한 줄만 적어 주세요.'
  };

  var STYLE_ID = 'feedback-style';
  var CSS = [
    '.fb{--fb-ink:#1F2A2A;--fb-muted:#5A6667;--fb-line:#D8E1E0;--fb-accent:#2F6F8F;--fb-soft:#E7F0F4;--fb-staff:#FFF6E3;--fb-staff-line:#E9CF95;--fb-red:#C0392B;font:inherit;color:var(--fb-ink);line-height:1.55}',
    '.fb *{box-sizing:border-box}',
    '.fb p{margin:0}',
    '.fb-form{display:flex;flex-direction:column;gap:10px}',
    '.fb-kinds{display:flex;flex-wrap:wrap;gap:6px;border:0;margin:0;padding:0}',
    '.fb-kinds legend{font-size:13px;color:var(--fb-muted);margin-bottom:6px;padding:0}',
    '.fb-kind{font:inherit;font-size:13px;padding:6px 10px;border-radius:999px;border:1.5px solid var(--fb-line);background:#fff;color:var(--fb-ink);cursor:pointer}',
    '.fb-kind[aria-pressed="true"]{border-color:var(--fb-accent);background:var(--fb-soft);color:var(--fb-accent);font-weight:600}',
    '.fb label{font-size:13px;color:var(--fb-muted)}',
    '.fb textarea{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--fb-line);border-radius:10px;resize:vertical;min-height:80px;background:#fff;color:var(--fb-ink)}',
    '.fb-count{font-size:12px;color:var(--fb-muted);text-align:right}',
    '.fb-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}',
    '.fb-btn{font:inherit;font-size:14px;padding:8px 14px;border-radius:10px;border:0;background:var(--fb-accent);color:#fff;cursor:pointer}',
    '.fb-btn.secondary{background:#fff;color:var(--fb-accent);border:1.5px solid var(--fb-accent)}',
    '.fb-btn.danger{background:#fff;color:var(--fb-red);border:1.5px solid var(--fb-red)}',
    '.fb-btn[disabled]{background:var(--fb-line);color:var(--fb-muted);border-color:transparent;cursor:default}',
    '.fb button:focus-visible,.fb textarea:focus-visible{outline:3px solid #F4B942;outline-offset:2px}',
    '.fb-msg{font-size:13px;min-height:1px}',
    '.fb-note{font-size:12px;color:var(--fb-muted)}',
    '.fb-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}',
    '.fb-item{border:1px solid var(--fb-line);border-radius:12px;background:#fff}',
    '.fb-head{width:100%;text-align:left;font:inherit;background:none;border:0;padding:10px 12px;cursor:pointer;color:var(--fb-ink);display:flex;flex-direction:column;gap:2px}',
    '.fb-meta{font-size:12px;color:var(--fb-muted);display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}',
    '.fb-status{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--fb-soft);color:var(--fb-accent)}',
    '.fb-status[data-s="done"]{background:#E6F2E9;color:#2E6B4F}',
    '.fb-new{font-size:11px;padding:1px 8px;border-radius:999px;background:var(--fb-red);color:#fff;font-weight:600}',
    '.fb-preview{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}',
    '.fb-thread{padding:0 12px 12px;display:flex;flex-direction:column;gap:8px}',
    '.fb-bubble{padding:8px 10px;border-radius:12px;font-size:14px;white-space:pre-line;overflow-wrap:anywhere;max-width:92%}',
    '.fb-bubble.me{align-self:flex-end;background:var(--fb-soft)}',
    '.fb-bubble.staff{align-self:flex-start;background:var(--fb-staff);border:1px solid var(--fb-staff-line)}',
    '.fb-who{display:block;font-size:11px;color:var(--fb-muted);margin-bottom:2px}',
    '.fb-courier{font-size:12px;color:#7A5410;margin-top:2px}',
    '.fb-crisis{padding:12px 14px;border:3px solid #d64545;border-radius:12px;background:#fff5f5;color:#3a1515}',
    '.fb-crisis b{display:block;margin-bottom:4px}',
    '.fb-crisis .num{font-size:20px;font-weight:800;color:var(--fb-red);user-select:all;margin-left:6px}'
  ].join('\n');

  function injectStyle() {
    if (document.getElementById(STYLE_ID)) return;
    var s = document.createElement('style');
    s.id = STYLE_ID;
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }

  async function rpc(sb, name, args) {
    try { return await sb.rpc(name, args); } catch (e) { return { error: e }; }
  }

  function when(iso) {
    try {
      return new Date(iso).toLocaleString('ko-KR', { timeZone: 'Asia/Seoul', month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit', hour12: false });
    } catch (e) { return ''; }
  }

  function crisisBox() {
    return el('div', { class: 'fb-crisis', role: 'alert' }, [
      el('b', { text: '지금 바로 이야기할 수 있는 곳' }),
      el('p', null, ['자살예방 상담전화', el('span', { class: 'num', text: '109' }), ' 24시간 · 무료']),
      el('p', null, ['정신건강 상담전화', el('span', { class: 'num', text: '1577-0199' })]),
      el('p', { text: '위급하면 112 또는 119에 바로 연락하세요. 카페 앞 루미에게 이야기해도 괜찮아요.' })
    ]);
  }

  var uid = 0;
  function textArea(label, max, placeholder) {
    var id = 'fb-ta-' + (++uid);
    var ta = el('textarea', { id: id, maxlength: String(max), rows: '3', placeholder: placeholder || '' });
    var count = el('p', { class: 'fb-count', text: '0 / ' + max });
    ta.addEventListener('input', function () { count.textContent = ta.value.length + ' / ' + max; });
    return { ta: ta, nodes: [el('label', { for: id, text: label }), ta, count] };
  }

  // ---------------------------------------------------------------- 의견 쓰기
  function compose(opts) {
    injectStyle();
    var sb = opts.sb;
    var kind = null;
    var msg = el('p', { class: 'fb-msg', 'aria-live': 'polite' });
    var kindBtns = KINDS.map(function (k) {
      return el('button', { class: 'fb-kind', type: 'button', 'aria-pressed': 'false', 'data-kind': k.key, text: k.label, onclick: function () {
        kind = k.key;
        kindBtns.forEach(function (b) { b.setAttribute('aria-pressed', b.dataset.kind === kind ? 'true' : 'false'); });
      } });
    });
    var area = textArea('어떤 내용인가요?', 300, '예: 지도에서 공원 가는 길이 헷갈려요');
    var send = el('button', { class: 'fb-btn', type: 'button', text: '보내기' });
    var cancel = opts.onCancel ? el('button', { class: 'fb-btn secondary', type: 'button', text: '취소', onclick: opts.onCancel }) : null;
    var root = el('div', { class: 'fb fb-form' }, [
      el('p', { class: 'fb-note', text: LINES.ask }),
      el('fieldset', { class: 'fb-kinds' }, [el('legend', { text: '종류' })].concat(kindBtns)),
    ].concat(area.nodes, [el('div', { class: 'fb-row' }, [send, cancel]), msg]));

    send.addEventListener('click', async function () {
      var text = area.ta.value.trim();
      if (!kind) { msg.textContent = '종류를 하나 골라 주세요.'; kindBtns[0].focus(); return; }
      if (!text) { msg.textContent = LINES.noBody; area.ta.focus(); return; }
      send.disabled = true;
      var r = await rpc(sb, 'submit_feedback', { p_channel: opts.channel || 'chief', p_kind: kind, p_place: opts.place || null, p_body: text, p_serv_id: null });
      var out = r.error ? 'error' : r.data;
      if (out === 'saved') {
        root.replaceChildren(el('p', { class: 'fb-msg', role: 'status', text: LINES.saved }));
      } else if (out === 'crisis') {
        root.replaceChildren(el('p', { class: 'fb-msg', text: LINES.crisis }), crisisBox());
      } else {
        msg.textContent = out === 'too_many' ? LINES.many : LINES.failed;
        send.disabled = out === 'too_many';
        if (r.error) console.warn('[feedback] 보내기 실패', r.error.message || r.error);
      }
      if (opts.onDone) opts.onDone(out);
    });
    return root;
  }

  // ---------------------------------------------------------------- 내 의견함
  function inbox(opts) {
    injectStyle();
    var sb = opts.sb;
    var root = el('div', { class: 'fb' });
    var openId = null;
    var current = [];
    function changed() { if (opts.onChange) opts.onChange(current.filter(function (x) { return x.unread; }).length); }

    async function load() {
      root.replaceChildren(el('p', { class: 'fb-note', text: '불러오는 중…' }));
      var r = await rpc(sb, 'my_feedback', {});
      if (r.error) { root.replaceChildren(el('p', { class: 'fb-msg', text: LINES.loadFail })); return; }
      render(r.data || []);
    }

    function render(rows) {
      current = rows;
      var top = el('div', { class: 'fb-row', style: 'justify-content:space-between;margin-bottom:10px' }, [
        el('p', { class: 'fb-note', text: rows.length ? '보낸 의견 ' + rows.length + '개' : LINES.empty }),
        opts.onCompose ? el('button', { class: 'fb-btn secondary', type: 'button', text: '새 의견 보내기', onclick: opts.onCompose }) : null
      ]);
      var list = el('ul', { class: 'fb-list' }, rows.map(item));
      root.replaceChildren(top, list, el('p', { class: 'fb-note', style: 'margin-top:10px', text: LINES.keep }));
      changed();
    }

    function item(f) {
      var li = el('li', { class: 'fb-item', 'data-id': String(f.id) });
      var thread = null;
      var head = el('button', { class: 'fb-head', type: 'button', 'aria-expanded': 'false', onclick: toggle }, [
        el('span', { class: 'fb-meta' }, [
          f.unread ? el('span', { class: 'fb-new', text: '새 답' }) : null,
          el('span', { class: 'fb-status', 'data-s': f.status, text: STATUS[f.status] || f.status }),
          el('span', { text: (CHANNEL[f.channel] || '') + ' · ' + (KIND_LABEL[f.kind] || f.kind) + (f.program_name ? ' · ' + f.program_name : '') }),
          el('span', { text: when(f.created_at) })
        ]),
        el('span', { class: 'fb-preview', text: f.body })
      ]);
      li.appendChild(head);

      function toggle() {
        if (thread) { thread.remove(); thread = null; head.setAttribute('aria-expanded', 'false'); openId = null; return; }

        li.appendChild(thread);
        head.setAttribute('aria-expanded', 'true');
        openId = f.id;
        if (f.unread) {
          f.unread = false;
          var badge = head.querySelector('.fb-new'); if (badge) badge.remove();
          rpc(sb, 'read_my_feedback', { p_id: f.id });
          changed();
        }
      }
      if (openId === f.id) setTimeout(toggle, 0);
      return li;
    }

    function threadView(f) {
      var nodes = [el('p', { class: 'fb-bubble me' }, [el('span', { class: 'fb-who', text: '나 · ' + when(f.created_at) + (f.place ? ' · ' + f.place : '') }), f.body])];
      var courierShown = false;
      (f.messages || []).forEach(function (m) {
        if (m.who === 'staff') {
          if (!courierShown) { nodes.push(el('p', { class: 'fb-courier', text: COURIER[f.channel] || COURIER.chief })); courierShown = true; }
          nodes.push(el('p', { class: 'fb-bubble staff' }, [el('span', { class: 'fb-who', text: '운영팀 · 사람이 직접 쓴 답 · ' + when(m.at) }), m.body]));
        } else {
          nodes.push(el('p', { class: 'fb-bubble me' }, [el('span', { class: 'fb-who', text: '나 · ' + when(m.at) }), m.body]));
        }
      });
      var area = textArea('운영팀에 더 전할 말', 300, '');
      var msg = el('p', { class: 'fb-msg', 'aria-live': 'polite' });
      var send = el('button', { class: 'fb-btn', type: 'button', text: '답장 보내기' });
      var del = el('button', { class: 'fb-btn danger', type: 'button', text: '이 의견 지우기' });
      send.addEventListener('click', async function () {
        var text = area.ta.value.trim();
        if (!text) { msg.textContent = LINES.noBody; area.ta.focus(); return; }
        send.disabled = true;
        var r = await rpc(sb, 'reply_my_feedback', { p_id: f.id, p_body: text });
        var out = r.error ? 'error' : r.data;
        if (out === 'saved') { openId = f.id; load(); return; }
        if (out === 'crisis') { box.replaceChildren(el('p', { class: 'fb-msg', text: LINES.crisis }), crisisBox()); return; }
        msg.textContent = out === 'too_many' ? LINES.many : LINES.failed;
        send.disabled = out === 'too_many';
      });
      var confirmStep = false;
      del.addEventListener('click', async function () {
        if (!confirmStep) { confirmStep = true; del.textContent = '정말 지울까요? 한 번 더 누르면 지워져요'; return; }
        del.disabled = true;
        var r = await rpc(sb, 'delete_my_feedback', { p_id: f.id });
        if (r.error || r.data === false) { msg.textContent = '지우지 못했어요. 잠시 뒤 다시 해 주세요.'; del.disabled = false; return; }
        openId = null;
        load();
      });
      var box = el('div', { class: 'fb-form' }, area.nodes.concat([el('div', { class: 'fb-row' }, [send, del]), msg]));
      nodes.push(box);
      return el('div', { class: 'fb-thread' }, nodes);
    }

    load();
    root.reload = load;
    return root;
  }

  async function unread(sb) {
    var r = await rpc(sb, 'my_feedback_unread', {});
    return r.error ? 0 : (Number(r.data) || 0);
  }

  global.Feedback = { compose: compose, inbox: inbox, unread: unread, _lines: LINES };
})(window);

</script>

<script>
/* Effect registry. Register a file below, then call Sound.play('name'). */
(function (global) {
  'use strict';
  const effects = new Map(), buffers = new Map();
  let context = null, active = null, muted = false, masterVolume = 0.65, requestId = 0;

  function register(name, src, options = {}) {
    if (!name || !src) throw new Error('Sound.register requires a name and file path.');
    effects.set(name, { src, volume: options.volume ?? 1 });
  }
  function getContext() {
    const Context = global.AudioContext || global.webkitAudioContext;
    if (!Context) return null;
    return context ??= new Context();
  }
  async function unlock() {
    try {
      const ctx = getContext();
      if (ctx?.state === 'suspended') await ctx.resume();
    } catch (_) { /* A blocked sound must not interrupt the game. */ }
  }
  async function load(src) {
    if (!buffers.has(src)) {
      const promise = (async () => {
        const response = await fetch(src);
        if (!response.ok) throw new Error('Sound file could not be loaded: ' + src);
        return getContext().decodeAudioData(await response.arrayBuffer());
      })().catch(error => { buffers.delete(src); throw error; });
      buffers.set(src, promise);
    }
    return buffers.get(src);
  }
  function stop(cancelPending = true) {
    if (cancelPending) requestId++;
    if (!active) return;
    try { active.stop ? active.stop() : active.pause(); } catch (_) {}
    active = null;
  }
  async function play(name) {
    const effect = effects.get(name);
    if (!effect || muted) return false;
    const requestedAt = Date.now(), request = ++requestId;
    const volume = Math.max(0, Math.min(1, masterVolume * effect.volume));
    try {
      const ctx = getContext();
      if (ctx) {
        await unlock();
        if (ctx.state !== 'running' || request !== requestId) return false;
        const buffer = await load(effect.src);
        // Do not replay an old alert after a later click unlocks sound.
        if (muted || request !== requestId || Date.now() - requestedAt > 2000) return false;
        stop(false);
        const source = ctx.createBufferSource(), gain = ctx.createGain();
        source.buffer = buffer;
        gain.gain.value = volume;
        source.connect(gain); gain.connect(ctx.destination);
        active = source;
        source.onended = () => {
          source.disconnect(); gain.disconnect();
          if (active === source) active = null;
        };
        source.start();
        return true;
      }
    } catch (_) { /* file:// may reject fetch; the audio element also supports local files. */ }
    if (muted || Date.now() - requestedAt > 2000) return false;
    try {
      stop(false);
      const audio = new Audio(effect.src);
      audio.volume = volume; active = audio;
      audio.onended = () => { if (active === audio) active = null; };
      await audio.play();
      return true;
    } catch (_) { active = null; return false; }
  }

    register, play, stop, unlock,
    setVolume(value) { masterVolume = Math.max(0, Math.min(1, Number(value) || 0)); },
    setMuted(value) { muted = !!value; if (muted) stop(); }
  };

  for (const event of ['pointerdown', 'keydown']) {
    document.addEventListener(event, unlock, { capture: true });

<script>
/* Item definitions, water geometry and demo balance are independent of UI/3D. */
(function(root){
 'use strict';
 const categories={paper:'종이',plastic:'플라스틱',metal:'캔·금속',glass:'유리',general:'일반쓰레기'};
 const items={
  rod:{name:'기본 낚싯대',kind:'tool',color:'#af8552',description:'장착한 뒤 물가에서 낚시할 수 있어요.'},
  paleChub:{name:'피라미',kind:'fish',range:[8,20],color:'#7eacc4'},
  catfish:{name:'메기',kind:'fish',range:[25,80],color:'#7c8991'},
  bitterling:{name:'각시붕어',kind:'fish',range:[3,9],color:'#dba376'},
  loach:{name:'미꾸라지',kind:'fish',range:[8,25],color:'#9c8662'},
  crucian:{name:'붕어',kind:'fish',range:[12,40],color:'#c9b46c'},
  carp:{name:'잉어',kind:'fish',range:[25,90],color:'#c58d64'},
  doctorFish:{name:'닥터피쉬',kind:'fish',range:[3,12],color:'#8da891'},
  coin:{name:'작은 동전',kind:'collectible',color:'#dbba60',description:'누군가의 소원이 담겨 있을까요? 돈으로 환산되지 않는 수집품이에요.'},
  bottle:{name:'빈 페트병',kind:'trash',recycle:'plastic',color:'#83b7b6'},
  can:{name:'빈 음료 캔',kind:'trash',recycle:'metal',color:'#a6b5ba'},
  paper:{name:'종이상자',kind:'trash',recycle:'paper',color:'#bf9b70'},
  glassBottle:{name:'유리병',kind:'trash',recycle:'glass',color:'#749a7f'},
  wetPaper:{name:'젖은 쪽지',kind:'trash',recycle:'general',color:'#bbbaa5',description:'글씨가 지워진 쪽지예요. 이 게임에서는 일반쓰레기로 분류해요.'},
  cap:{name:'플라스틱 병뚜껑',kind:'trash',recycle:'plastic',color:'#b9b2cf'}
 };
 const waters=[
  {id:'river',name:'강',shape:'strip',x0:-52,x1:52,z:-24,halfWidth:2.7,y:.05,reach:3.4,fish:[['paleChub',70],['catfish',20]],trash:['bottle','paper']},
  {id:'park',name:'공원 연못',shape:'circle',x:-14,z:12,r:3,y:.30,reach:2.5,fish:[['bitterling',70],['loach',20]],trash:['glassBottle','paper']},
  {id:'lake',name:'호수',shape:'circle',x:10,z:44,r:6.2,y:.30,reach:2.5,fish:[['crucian',70],['carp',20]],trash:['can','bottle']},
  {id:'fountain',name:'분수대',shape:'circle',x:0,z:0,r:2.95,y:.60,reach:1.65,hidden:true,fish:[['doctorFish',55],['coin',30]],trash:['cap','wetPaper']}
 ];
 const timing={castMs:650,waitMinMs:2500,waitMaxMs:5500,biteMs:2200};
 function locate(pos){
  if(!pos)return null;
  for(const w of waters){
   if(w.shape==='strip'){
    const gap=Math.abs(pos.z-w.z)-w.halfWidth;
    if(pos.x>=w.x0&&pos.x<=w.x1&&gap>=0&&gap<=w.reach){const sign=pos.z>=w.z?1:-1;return {water:w,point:{x:pos.x,z:w.z+sign*(w.halfWidth-.7),y:w.y}};}
   }else{
    const dx=pos.x-w.x,dz=pos.z-w.z,d=Math.hypot(dx,dz),gap=d-w.r;
    if(gap>=0&&gap<=w.reach){const radius=w.r-(w.hidden ? .65 : 1);return {water:w,point:{x:w.x+dx/d*radius,z:w.z+dz/d*radius,y:w.y}};}
   }
  }
  return null;
 }
 function roll(waterId,random=Math.random){
  const w=waters.find(w=>w.id===waterId);if(!w)throw Error('Unknown water');
  const trashWeight=100-w.fish.reduce((s,e)=>s+e[1],0);
  const table=[...w.fish,...w.trash.map(id=>[id,trashWeight/w.trash.length])];
  let value=random()*100,id=table.at(-1)[0];for(const [key,weight] of table){value-=weight;if(value<0){id=key;break;}}
  const def=items[id],entry={itemId:id,waterId:w.id,caughtAt:new Date().toISOString()};
  if(def.kind==='fish')entry.sizeCm=Number((def.range[0]+random()*(def.range[1]-def.range[0])).toFixed(1));
  return entry;
 }
 const api={items,waters,categories,timing,locate,roll};root.FishingData=api;

<script>
/* Instances remain separate in storage; grouping is only a view. */
(function(root){
 'use strict';
 function create({storage,key,data,onChange=()=>{}}){
  const fresh=()=>({version:1,equipped:null,instances:[{id:'starter-rod',itemId:'rod'}],recycled:[]});
  let state=fresh();
  try{
   const v=JSON.parse(storage.getItem(key)||'null');
   if(v?.version===1&&Array.isArray(v.instances)){
    const ids=new Set();
    state={version:1,equipped:v.equipped==='rod'?'rod':null,instances:v.instances.filter(e=>{
     const def=data.items[e?.itemId];if(!def||typeof e.id!=='string'||ids.has(e.id))return false;
     if(def.kind==='fish'&&(!Number.isFinite(e.sizeCm)||e.sizeCm<def.range[0]||e.sizeCm>def.range[1]))return false;
     ids.add(e.id);return true;
    }),recycled:Array.isArray(v.recycled)?v.recycled:[]};
    state.instances=state.instances.filter(e=>e.itemId!=='rod');state.instances.unshift({id:'starter-rod',itemId:'rod'});
   }
  }catch(e){}
  function commit(mutator){
   const next=JSON.parse(JSON.stringify(state));mutator(next);
   storage.setItem(key,JSON.stringify(next));state=next;onChange();return true;
  }
  function getState(){return JSON.parse(JSON.stringify(state));}
  function groups(){
   const grouped=new Map();for(const e of state.instances){if(!grouped.has(e.itemId))grouped.set(e.itemId,{itemId:e.itemId,definition:data.items[e.itemId],instances:[]});grouped.get(e.itemId).instances.push({...e});}
   return [...grouped.values()];
  }
  function add(entry){
   const def=data.items[entry?.itemId];if(!def||def.kind==='tool')throw Error('Invalid catch');
   if(def.kind==='fish'&&(!Number.isFinite(entry.sizeCm)||entry.sizeCm<def.range[0]||entry.sizeCm>def.range[1]))throw Error('Invalid fish size');
   const instance={...entry,id:root.crypto?.randomUUID?.()||Date.now().toString(36)+'-'+Math.random().toString(36).slice(2)};
   commit(next=>next.instances.push(instance));return {...instance};
  }
  function equip(){return commit(next=>{next.equipped=next.equipped==='rod'?null:'rod';});}
  function recycle(id,category){
   const e=state.instances.find(e=>e.id===id),def=data.items[e?.itemId];
   if(def?.kind!=='trash'||def.recycle!==category)return false;
   commit(next=>{next.instances=next.instances.filter(e=>e.id!==id);next.recycled.push({...e,recycledAt:new Date().toISOString(),category});});return true;
  }

  const local=create({storage,key,data,onChange});

  const getState=()=>online()?economy.getState().inventory:local.getState();
  const canLocal=()=>economy.status().mode==='legacy';
  const unsubscribe=economy.subscribe(onChange);
  function groups(){const grouped=new Map();for(const e of getState().instances){const definition=data.items[e.itemId];if(!definition)continue;if(!grouped.has(e.itemId))grouped.set(e.itemId,{itemId:e.itemId,definition,instances:[]});grouped.get(e.itemId).instances.push({...e});}return [...grouped.values()];}

   recycle(id,category){if(online())return economy.run('recycle',{instanceId:id,category}).then(()=>true);requireReady();return local.recycle(id,category);}
  };

</script>

    <footer class="inventory-footer"><span>분리수거 ${state.recycled.length+(state.legacyRecycledCount||0)}개 완료</span><span>${keyLabel(ui.bindings.inventory)} / Esc 닫기</span></footer></section>`;
   document.querySelector('[data-inventory-close]').onclick=()=>closePanel();
   document.querySelectorAll('[data-inventory-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.inventoryFilter;renderInventory();document.querySelector(`[data-inventory-filter="${filter}"]`)?.focus();});
   document.querySelectorAll('[data-item]').forEach(b=>b.onclick=()=>{selected=b.dataset.item;renderInventory();document.querySelector(`[data-item="${selected}"]`)?.focus();});
   document.querySelector('#equip-rod')?.addEventListener('click',async()=>{try{await store.equip();if(destroyed)return;toast(store.isEquipped()?'낚싯대를 장착했어요. 물가로 가 보세요.':'낚싯대를 내려놓았어요.');document.querySelector('#equip-rod')?.focus();}catch(e){if(!destroyed)toast(root.OnlineEconomy.message(e));}});
   document.querySelector('#inventory-retry')?.addEventListener('click',()=>economy.retry().catch(e=>toast(root.OnlineEconomy.message(e))));
   document.querySelector('#equip-clothing')?.addEventListener('click',async e=>{const id=e.currentTarget.dataset.instance;try{await economy.equipClothing(economy.getState().equippedClothing===id?null:id);if(!destroyed)toast('옷차림을 바꿨어요.');}catch(error){if(!destroyed)toast(root.OnlineEconomy.message(error));}});
   if(economy?.status().busy||economy?.status().mode==='loading')document.querySelectorAll('#equip-rod,#equip-clothing,#recycle-item,#inventory-retry').forEach(b=>b.disabled=true);
   document.querySelector('#recycle-item')?.addEventListener('click',async e=>{
    try{const ok=await store.recycle(e.currentTarget.dataset.instance,document.querySelector('#recycle-category').value);if(destroyed)return;toast(ok?'알맞은 수거함에 넣었어요.':'다른 수거함을 골라 주세요. 아이템 설명에서 분류를 확인할 수 있어요.');}catch(e){if(!destroyed)toast(root.OnlineEconomy.message(e));}
   });
  }
  function toggleInventory(){if(!allowed()||isBusy())return;if(ui.panel==='inventory'){closePanel();return;}openPanel('inventory');renderInventory();setupFocus();economy?.refresh();}
  function currentSpot(){return !saving&&(!economy||(!economy.status().busy&&!economy.status().pending&&['online','legacy'].includes(economy.status().mode)))&&allowed()&&!isBusy()&&engine?.mode()==='village'&&store.isEquipped()?D.locate(engine.playerPos()):null;}
  function target(fallback){
   if(!allowed()||isBusy())return fallback;
   if(saving)return {type:'fishing',id:'saving',label:'아이템 저장 중'};
   if(fishing)return {type:'fishing',id:fishing.water.id,label:fishing.phase==='bite'?'지금 낚아채기':'낚싯대 거두기'};
   const spot=currentSpot();return spot&&!spot.water.hidden?{type:'fishing',id:spot.water.id,label:spot.water.name+' · 낚시하기'}:fallback;
  }
  function updateHud(){
   const spot=currentSpot(),phase=fishing?.phase||'idle',seconds=phase==='bite'?Math.max(0,Math.ceil((fishing.deadline-performance.now())/1000)):0;
   const signature=[phase,spot?.water.id,store.isEquipped(),seconds,ui.panel,allowed(),isBusy(),guide.completed,guide.dismissed,keyLabel(ui.bindings.interact),keyLabel(ui.bindings.inventory)].join('|');if(signature===lastHud)return;lastHud=signature;
   launch.querySelector('b').textContent=keyLabel(ui.bindings.inventory);
   launch.hidden=!allowed();
   status.hidden=!allowed()||!store.isEquipped()||!!ui.panel||isBusy()||!!(spot?.water.hidden||fishing?.water.hidden)||guide.dismissed||guide.completed>=3;
   status.dataset.phase=phase;
   if(status.hidden)return;
   const title=phase==='connecting'?'낚시를 준비하고 있어요':phase==='cast'?'낚싯대를 드리우고 있어요':phase==='waiting'?'찌를 지켜보세요':phase==='bite'?'물었어요! 지금 낚아채세요':spot?spot.water.name+' · 낚시 가능':'낚싯대 장착 중';
   const line=phase==='bite'?`찌가 물 아래로 잠겼어요 · ${seconds}초`:fishing?'찌가 잠기면 상호작용하세요.':spot?`${keyLabel(ui.bindings.interact)}를 눌러 낚싯대를 드리워요.`:'강 · 공원 연못 · 호수의 물가로 가 보세요.';
   status.innerHTML=`<button class="fishing-guide-dismiss" type="button" aria-label="낚시 안내 끄기">안내 끄기</button><span class="fishing-indicator" aria-hidden="true"></span><div><strong>${title}</strong><p>${line}</p></div>${fishing?'<button id="fishing-cancel" aria-label="낚시 취소">취소</button>':`<kbd>${keyLabel(ui.bindings.interact)}</kbd>`}`;
   status.querySelector('.fishing-guide-dismiss').addEventListener('click',dismissGuide);
   document.querySelector('#fishing-cancel')?.addEventListener('click',()=>cancel(true));
  }
  function cancel(show=false,remote=true){
   if(!fishing)return;const castId=fishing.castId;fishing=null;if(remote&&castId&&!economy?.status().busy)economy?.cancelFishing(castId).catch(()=>{});engine?.setFishingVisual(null);engine?.pauseInput();lastHud='';updateHud();if(show)toast('낚싯대를 거두었어요.');
  }
  function interact({hiddenOnly=false}={}){
   if(!allowed()||ui.panel||isBusy())return false;
   if(saving)return true;
   if(hiddenOnly&&!(fishing?.water.hidden||currentSpot()?.water.hidden))return false;
   if(fishing){
    if(fishing.phase!=='bite'){cancel();toast('찌가 잠기기 전에 거두었어요. 다시 던져 보세요.');return true;}
    if(performance.now()>fishing.deadline){cancel();toast('놓쳤어요. 다시 도전해 보세요.');return true;}
    const waterId=fishing.water.id,castId=fishing.castId;cancel(false,false);
    const caughtMessage=caught=>{if(destroyed)return;const def=D.items[caught.itemId];toast(`${def.name}${def.kind==='fish'?' '+caught.sizeCm.toFixed(1)+' cm':''}을 낚았어요! · 인벤토리 ${keyLabel(ui.bindings.inventory)}`);guide.completed=Math.min(3,guide.completed+1);saveGuide();updateHud();root.dispatchEvent(new CustomEvent('socialworld:catch',{detail:{...caught,kind:def.kind}}));};
    if(castId){saving=true;economy.finishFishing(castId).then(result=>{const caught=store.getState().instances.find(e=>e.id===result.itemId);if(caught)caughtMessage(caught);}).catch(e=>{if(!destroyed)toast(root.OnlineEconomy.message(e));}).finally(()=>{saving=false;if(!destroyed){lastHud='';updateHud();}});}
    else try{caughtMessage(store.add(D.roll(waterId)));}catch(e){toast(root.OnlineEconomy.message(e));}
    return true;
   }
   const spot=currentSpot();if(!spot)return false;
   engine.pauseInput();const now=performance.now();
   fishing={...spot,origin:engine.playerPos(),phase:'cast',castAt:now,biteAt:now+D.timing.castMs+D.timing.waitMinMs+Math.random()*(D.timing.waitMaxMs-D.timing.waitMinMs)};
   engine.setFishingVisual({point:spot.point,phase:'cast',progress:0});lastHud='';updateHud();
   if(economy?.status().hasOnlineState){const attempt=fishing;attempt.phase='connecting';attempt.biteAt=Infinity;economy.beginFishing(spot.water.id).then(result=>{if(destroyed||fishing!==attempt){if(!economy.status().busy) economy.cancelFishing(result.castId).catch(()=>{});return;}const now=performance.now(),server=Date.parse(result.serverNow);attempt.castId=result.castId;attempt.phase='cast';attempt.castAt=now;attempt.biteAt=now+Math.max(0,Date.parse(result.biteAt)-server);attempt.onlineDeadline=now+Math.max(0,Date.parse(result.expiresAt)-server);lastHud='';updateHud();}).catch(e=>{if(fishing===attempt)cancel(false,false);if(!destroyed)toast(root.OnlineEconomy.message(e));});}
   return true;
  }
  function tick(){
   if(fishing){
    const p=engine.playerPos();
    if(!allowed()||isBusy()||engine.mode()!=='village'||!store.isEquipped()||ui.panel||Math.hypot(p.x-fishing.origin.x,p.z-fishing.origin.z)>.8){cancel();return;}
    const now=performance.now();
    if(fishing.phase==='cast'&&now-fishing.castAt>=D.timing.castMs)fishing.phase='waiting';
    if(fishing.phase==='waiting'&&now>=fishing.biteAt){fishing.phase='bite';fishing.deadline=fishing.onlineDeadline||fishing.biteAt+D.timing.biteMs;if(now<=fishing.deadline)root.Sound?.play('fishingBite');}
    if(fishing.phase==='bite'&&now>fishing.deadline){cancel();toast('놓쳤어요. 찌가 잠기면 바로 낚아채세요.');return;}
    const progress=fishing.phase==='cast'?Math.min(1,(now-fishing.castAt)/D.timing.castMs):fishing.phase==='bite'?Math.min(1,(now-fishing.biteAt)/230):1;
    engine.setFishingVisual({point:fishing.point,phase:fishing.phase,progress});
   }
   updateHud();
  }
  function onVisibility(){if(document.hidden)cancel();}
  function onBlur(){cancel();}
  function onEscape(e){if(e.key==='Escape'&&fishing&&!ui.panel){e.preventDefault();cancel(true);}}
  document.addEventListener('visibilitychange',onVisibility);
  root.addEventListener('blur',onBlur);
  document.addEventListener('keydown',onEscape,true);
  function destroy(){destroyed=true;store.destroy?.();cancel();engine?.setRodEquipped(false);launch.remove();status.remove();document.removeEventListener('visibilitychange',onVisibility);root.removeEventListener('blur',onBlur);document.removeEventListener('keydown',onEscape,true);}
  engine?.setRodEquipped(store.isEquipped());
  updateHud();
  return {toggleInventory,renderInventory,cancel,interact,target,tick,updateHud,destroy,store,get state(){return saving?{phase:'saving'}:fishing?{phase:fishing.phase,waterId:fishing.water.id,biteAt:fishing.biteAt,deadline:fishing.deadline,point:{...fishing.point}}:null;}};
 };
})(window);

</script>

<script>
/*

 *   - 순간이동은 앱에 맡긴다(host.teleport) — 캐릭터 모양·집 이름·투어 상태가 유지되게
 *
 * 앱이 넘겨주는 host (WorldUI.init(host)):
 *   sb                    Supabase 클라이언트
 *   userId()              로그인한 사용자 id
 *   nickname()            닉네임
 *   feedback()            cohort_feedback (추천 미션 순서) 또는 null
 *   npcs()                [{id, name, emoji, color}] 마을 NPC 목록
 *   busy()                앱 대화창(NPC·튜토리얼·코코·이장)이 열려 있으면 true
 *   openNpc(id)           NPC 대화 열기
 *   teleport(spawn, facing) 마을의 그 자리로 이동 (투어 중이면 false)
 *   openMissionRoom()     미션방 화면
 *   openClubRoom()        동아리센터 화면(동아리 개설 포함)
 *   logout()

 * 앱이 부르는 것:

 *   isOpen()              휴대폰·지도가 열려 있으면 true (엔진 입력 멈춤에 씀)
 *   keyLabel(action)      'interact' → 'E' 같은 현재 키 이름
 *   close() / reset()     화면 닫기 / 로그아웃 때 알림 상태 초기화
 *
 * 내 의견함(2026-10-07): ../feedback/feedback.js가 있으면 휴대폰에 '내 의견함' 앱이 생긴다(07_feedback_chat.sql).
 *   휴대폰을 열 때·마을에 들어올 때 운영팀 새 답 수를 확인해 배지로 보여 준다.
 *
 * 저장: 설정(미니맵 방향·화질·키·효과음)과 사용자 ID별 인벤토리를
 *       별도 localStorage 키에 남긴다. 인벤토리 저장은 inventory.js가 맡는다.
 *       대화 내용·알림 내용은 어디에도 저장하지 않는다.
 */
(function () {
  'use strict';

  // 코코 알림 배너 — 마을에 들어오고 잠시 뒤 한 번(로그인 1회당). 내용은 고정 문구, 위험 정보와 무관
  var COCO_NOTICE = { enabled: true, delayMs: 6500, retryMs: 3000, showMs: 9000 };

  var NPC_ROLE = {

  var DEFAULT_BINDINGS = { map: 'KeyM', inventory: 'KeyI', forward: 'KeyW', left: 'KeyA', back: 'KeyS', right: 'KeyD', interact: 'KeyE' };

  // ---------------------------------------------------------------- 이동
  // 전체 지도의 장소 — 이름표 위치(x,z)는 지도 그림 위치. 실제로 서는 자리는 엔진의 places()
  var MAP_POINTS = [
    { id: 'support', name: '지원센터', x: 0, z: -17 },
    { id: 'mission', name: '미션방', x: -17, z: -1 },
    { id: 'club', name: '동아리센터', x: 15, z: -11 },
    { id: 'game', name: '게임방', x: 17.5, z: -1.5 },
    { id: 'cafe', name: '카페', x: -11.8, z: -10.6 },
    { id: 'home', name: '내 집', x: 22, z: 12 },
    { id: 'plaza', name: '광장', x: 0, z: 5.5 },
    { id: 'park', name: '공원', x: -14, z: 16.5 },
    { id: 'lake', name: '호수', x: 10, z: 36.8 },
    { id: 'forest', name: '숲길', x: -38, z: 22 },
    { id: 'flowers', name: '꽃 언덕', x: 36, z: 38 },
    { id: 'field', name: '들판', x: 42, z: 6 },
    { id: 'bus', name: '시장행 버스', ...window.MarketWorldData.villageStop }
  ];
  // 엔진 places()에 없는 산책로 장소
  var EXTRA_SPOTS = { lake: { x: 10, z: 36.8 }, forest: { x: -38, z: 22 }, flowers: { x: 36, z: 38 }, field: { x: 42, z: 6 } };
  // 지도 그림 범위 — world-engine.js MAP_B 와 같아야 한다
  var mapPct = function (p) { return { left: (p.x + 58) / 116 * 100, top: (p.z + 34) / 92 * 100 }; };

  function goPlace(id) {
    var P = engine ? engine.places() : {};
    var spot = P[id] || EXTRA_SPOTS[id];
    if (!spot) { toast('이 장소는 아직 준비 중이에요.'); return; }
    closePanel();
    if (!host.teleport({ x: spot.x, z: spot.z })) return;
    var name = (currentMapPoints().filter(function (m) { return m.id === id; })[0] || {}).name || '목적지';
    toast(name + ' 앞으로 이동했어요');
  }

  // NPC 앞(마을 가운데 쪽으로 1.8칸)으로 이동해 NPC를 바라본다
  function goNpc(id) {
    if (isMarket()) { toast('마을 주민을 만나려면 버스를 타고 마을로 돌아가 주세요.'); return false; }
    if (!engine) return false;
    var n = engine.npcPositions().filter(function (x) { return x.id === id; })[0];
    if (!n) return false;
    var l = Math.hypot(n.x, n.z) || 1;
    var spawn = { x: n.x - n.x / l * 1.8, z: n.z - n.z / l * 1.8 };
    return host.teleport(spawn, Math.atan2(n.x - spawn.x, n.z - spawn.z));
  }

  function contactNpc(id) {
    closePanel();
    if (CALL_ANYWHERE[id]) { host.openNpc(id); return; }
    if (!goNpc(id)) { toast('지금은 찾아갈 수 없어요.'); return; }
    setTimeout(function () { host.openNpc(id); }, 350);
  }

  // ---------------------------------------------------------------- 전체 지도
  function isMarket() { return engine && ['market', 'bank', 'clothing'].indexOf(engine.mode()) >= 0; }
  function currentMapPoints() { return isMarket() ? window.MarketWorldData.points : MAP_POINTS; }
  function currentMapPct(p) {
    if (!isMarket()) return mapPct(p);
    var b = window.MarketWorldData.mapBounds;
    return { left: (p.x - b.x0) / (b.x1 - b.x0) * 100, top: (p.z - b.z0) / (b.z1 - b.z0) * 100 };
  }
  function openMap() {
    if (!allowed()) return;
    openPanel('map');
    var inMarket = isMarket();
    var inRoom = engine && engine.mode && engine.mode() === 'room';
    var here = engine ? (inRoom ? engine.places().home : engine.playerPos()) : { x: 0.6, z: 7.4 };
    if (inMarket && engine.mode() !== 'market') here = engine.places()[engine.mode() === 'bank' ? 'market-bank' : 'market-clothing'];
    var pos = currentMapPct(here);
    $('#overlay').innerHTML =
      '<section class="ui-dialog map-dialog" role="dialog" aria-modal="true" aria-labelledby="map-title">' +
        '<header class="dialog-top"><div class="avatar">' + icon('map') + '</div>' +
          '<div><div class="eyebrow">' + (inMarket ? 'IEUM MARKET' : 'IEUM VILLAGE') + '</div><h2 id="map-title">' + (inMarket ? '이음 시장 지도' : '이음 마을 지도') + '</h2>' +
          '<p>장소 이름을 누르면 입구 앞으로 이동해요.</p></div>' +
          '<button class="icon-btn" data-close aria-label="지도 닫기">' + icon('close') + '</button></header>' +
        '<div class="map-main">' +
          '<div class="map-caption"><span>' + (inRoom ? '지금은 내 방에 있어요. 장소를 누르면 밖으로 나가요.' : inMarket && engine.mode() !== 'market' ? '지금은 실내에 있어요. 장소를 누르면 시장 광장으로 나가요.' : '궁금한 곳부터 천천히 둘러보세요.') +
            '</span><span><strong>N ↑</strong> 북쪽 고정</span></div>' +
          '<div class="map-frame"><canvas id="full-map" aria-label="이음 마을 전체 지도"></canvas>' +
            currentMapPoints().map(function (p) {
              var q = currentMapPct(p);
              return '<button class="map-point" style="left:' + q.left + '%;top:' + q.top + '%" data-place="' + p.id +
                '" aria-label="' + p.name + ' 앞으로 이동">' + p.name + '</button>';
            }).join('') +
            '<span class="map-player" style="left:' + pos.left + '%;top:' + pos.top + '%" aria-label="현재 내 위치"></span>' +
          '</div>' +
          '<div class="map-footer"><span style="color:#ce5849">● 내 위치</span>' +
            '<span style="margin-left:auto">' + codeLabel(settings.bindings.map) + ' / Esc 닫기</span></div>' +
        '</div>' +
      '</section>';
    var c = $('#full-map'), g = c.getContext('2d');
    c.setAttribute('aria-label', inMarket ? '이음 시장 전체 지도' : '이음 마을 전체 지도');
    c.width = 928; c.height = 736;
    if (engine && engine.mapBase) g.drawImage(engine.mapBase(), 0, 0, c.width, c.height);
    $('#overlay [data-close]').onclick = closePanel;
    Array.prototype.forEach.call($('#overlay').querySelectorAll('[data-place]'), function (b) {
      b.onclick = function () { goPlace(b.dataset.place); };
    });
    focusFirst();
  }

  // ---------------------------------------------------------------- 코코 알림
  function unread() { return (ui.notice && !ui.notice.read ? 1 : 0) + (ui.fbUnread || 0); }
  function updateBadge() {
    var b = $('#unread-badge'), n = unread();
    b.hidden = !n;
    b.textContent = n;
    $('#phone-launch').setAttribute('aria-label', '휴대폰 열기' + (n ? ', 새 메시지 ' + n + '개' : ''));
  }
  function hideNotice() {
    clearTimeout(ui.hideTimer);
    $('#notification').hidden = true;
  }
  function readNotice() {
    if (ui.notice) ui.notice.read = true;
    hideNotice();
    updateBadge();
  }
  function openCocoFromNotice() {
    readNotice();
    closePanel();
    host.openNpc('coco');
  }
  function scheduleNotice() {
    if (!COCO_NOTICE.enabled || !host) return;
    var uid = host.userId();
    if (ui.noticeUser !== uid) { ui.noticeUser = uid; ui.notice = null; }
    if (ui.notice || ui.noticeTimer || !ui.ctx.inVillage || ui.ctx.tour) return;
    ui.noticeTimer = setTimeout(tryNotice, COCO_NOTICE.delayMs);
  }
  function tryNotice() {
    ui.noticeTimer = null;
    if (ui.notice || !ui.ctx.inVillage || ui.ctx.tour || !document.body.classList.contains('in-world')) return;   // 다음 sync 때 다시
    if (ui.panel || host.busy() || (fishingFeature && fishingFeature.state)) { ui.noticeTimer = setTimeout(tryNotice, COCO_NOTICE.retryMs); return; }
    ui.notice = { line: '같이 해볼 만한 모임이랑 활동을 찾아놨어. 한번 볼래?', read: false };
    var box = $('#notification');
    box.innerHTML =
      '<div class="avatar coco">' + cocoFace() + '</div>' +
      '<button class="notify-content" id="notify-open"><b>코코 · 새 메시지</b><span>' + esc(ui.notice.line) +

      '<button class="dismiss" id="notify-dismiss" aria-label="알림 닫기">' + icon('close') + '</button>' +
      '<div class="notify-progress"></div>';

    $('#notify-open').onclick = openCocoFromNotice;
    $('#notify-dismiss').onclick = hideNotice;
    ui.hideTimer = setTimeout(hideNotice, COCO_NOTICE.showMs);

  // ---------------------------------------------------------------- 내 의견함 (운영팀 답 확인)
  function hasFeedback() { return !!(window.Feedback && host && host.sb); }
  function setFbUnread(n) {
    var before = ui.fbUnread || 0;
    ui.fbUnread = Math.max(0, n || 0);
    updateBadge();
    if (ui.panel === 'phone' && ui.page === 'home') {
      var b = $('#fb-app-badge'); if (b) { b.hidden = !ui.fbUnread; b.textContent = ui.fbUnread; }
    }
    return ui.fbUnread > before;
  }
  function checkFeedback(announce) {
    if (!hasFeedback() || !host.userId()) return;
    var uid = host.userId();
    if (ui.fbUser !== uid) { ui.fbUser = uid; ui.fbUnread = 0; }
    window.Feedback.unread(host.sb).then(function (n) {
      if (ui.fbUser !== uid) return;
      if (setFbUnread(n) && announce) toast('보낸 의견에 운영팀 답이 왔어요 — 휴대폰 → 내 의견함');
    });
  }

  // ---------------------------------------------------------------- DB (동아리·미션)
  function loadClubs() {
    var uid = host.userId();
    return Promise.all([
      host.sb.from('clubs').select('*, member_count:club_members(count)').order('created_at', { ascending: false }),
      uid ? host.sb.from('club_members').select('club_id').eq('user_id', uid) : Promise.resolve({ data: [] })
    ]).then(function (r) {
      if (r[0].error) throw r[0].error;
      ui.data.clubs = r[0].data || [];
      var mine = {};
      (r[1].data || []).forEach(function (x) { mine[x.club_id] = true; });
      ui.data.myClubs = mine;
    });
  }
  function loadMissions() {
    var uid = host.userId();
    return Promise.all([
      host.sb.from('missions').select('*').eq('is_active', true).order('id'),
      uid ? host.sb.from('mission_progress').select('*').eq('user_id', uid) : Promise.resolve({ data: [] })
    ]).then(function (r) {
      if (r[0].error) throw r[0].error;
      ui.data.missions = r[0].data || [];
      var map = {};
      (r[1].data || []).forEach(function (x) { map[x.mission_id] = x; });
      ui.data.progress = map;
    });
  }
  // 페이지에 들어갈 때마다 새로 읽는다(미션방·동아리센터 화면에서 바뀐 것도 반영)
  function refresh(page) {
    var loader = page === 'clubs' ? loadClubs : page === 'missions' ? loadMissions : null;
    if (!loader) return;
    ui.data.error = null;
    loader().catch(function (e) {
      ui.data.error = '목록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요.';
      console.warn('휴대폰 목록 불러오기 실패:', e && e.message);
    }).then(function () {
      if (ui.panel === 'phone' && ui.page === page) renderPhone();
    });
  }

  function joinClub(id, btn) {
    btn.disabled = true;
    host.sb.from('club_members').insert({ club_id: id, user_id: host.userId() }).then(function (res) {
      if (res.error) { toast('가입하지 못했어요. 잠시 뒤 다시 해 주세요.'); btn.disabled = false; return; }
      toast('동아리에 가입했어요');
      refresh('clubs');
    });
  }
  function startMission(id, btn) {
    btn.disabled = true;
    host.sb.from('mission_progress').insert({ user_id: host.userId(), mission_id: id, status: 'in_progress' }).then(function (res) {
      if (res.error) { toast('미션을 시작하지 못했어요.'); btn.disabled = false; return; }
      toast('미션을 시작했어요');
      refresh('missions');
    });
  }
  function completeMission(id, btn) {
    btn.disabled = true;
    host.sb.from('mission_progress').update({ status: 'done', completed_at: new Date().toISOString() })
      .eq('user_id', host.userId()).eq('mission_id', id)
      .then(function (res) {
        if (res.error) { toast('완료 처리를 하지 못했어요.'); btn.disabled = false; return; }
        toast('미션을 완료했어요');
        play('missionComplete');
        refresh('missions');
      });
  }

  function phoneNavigate(page, opt) {

  }

  function contactsHTML() {
    return '<div class="phone-list-intro"><p>주민에게 연락하기</p><span class="pill">NPC 연락처</span></div>' +
      host.npcs().map(function (n) {
        return '<button class="record-row" data-contact="' + n.id + '">' + avatar(n) +
          '<div class="record-text"><b>' + esc(n.name) + '</b><p>' + esc(NPC_ROLE[n.id] || '마을 주민') + '</p></div>' +
          (n.id === 'coco' && unread() ? '<span class="unread-dot" aria-label="새 메시지"></span>' : '') +
          '<small>' + (CALL_ANYWHERE[n.id] ? '바로 대화' : '찾아가기') + '</small></button>';
      }).join('') +
      '<p class="info-note">누르면 그 주민 앞으로 이동해서 대화가 열려요. 대화 내용은 저장하지 않아요.</p>';
  }

  function settingsHTML() {
    var hasEngine = !!engine;
    var listening = function (a) { return ui.bindingTarget === a; };
    return '<p class="settings-intro">화면과 조작을 내게 편한 방식으로 바꿔요.</p>' +
      '<section class="settings-section" aria-labelledby="display-settings-title"><h3 id="display-settings-title">화면</h3>' +
        '<label class="setting-row" for="setting-north"><span>미니맵 방향<small>빨간 N은 북쪽을 가리켜요.</small></span>' +
          '<select id="setting-north"><option value="fixed"' + (settings.north ? ' selected' : '') + '>북쪽 고정</option>' +
          '<option value="rotate"' + (!settings.north ? ' selected' : '') + '>시점 따라 회전</option></select></label>' +
        '<label class="setting-row" for="setting-quality"><span>화질<small>해상도와 그림자 품질</small></span>' +
          '<select id="setting-quality"' + (hasEngine ? '' : ' disabled') + '>' +
          '<option value="high"' + (engine && engine.gfxHigh() ? ' selected' : '') + '>높음</option>' +
          '<option value="low"' + (!(engine && engine.gfxHigh()) ? ' selected' : '') + '>가벼움</option></select></label>' +
        '<button class="action secondary setting-reset" id="setting-view"' + (hasEngine ? '' : ' disabled') + '>' + icon('reset') + ' 시점 초기화</button>' +
        '<p class="setting-note">시점의 방향·높이·줌을 처음 상태로 되돌려요.</p></section>' +
      '<section class="settings-section" aria-labelledby="sound-settings-title"><h3 id="sound-settings-title">소리</h3>' +
        '<label class="setting-row" for="setting-sound"><span>효과음<small>코코 알림·미션 완료·낚시 입질 소리</small></span>' +
          '<select id="setting-sound"><option value="on"' + (!settings.muted ? ' selected' : '') + '>켜기</option>' +
          '<option value="off"' + (settings.muted ? ' selected' : '') + '>끄기</option></select></label></section>' +
      '<section class="settings-section" aria-labelledby="key-settings-title"><h3 id="key-settings-title">키보드 조작</h3>' +
        '<p class="setting-note">키 버튼을 누른 뒤 영문자 또는 숫자 키를 눌러 바꿔요.</p>' +
        Object.keys(KEY_NAMES).map(function (a) {
          return '<div class="setting-row"><span>' + KEY_NAMES[a] + '</span>' +
            '<button class="key-binding' + (listening(a) ? ' listening' : '') + '" data-bind="' + a + '" aria-label="' + KEY_NAMES[a] +
            ' 키 바꾸기, 지금 ' + codeLabel(settings.bindings[a]) + '" aria-pressed="' + listening(a) + '">' +
            (listening(a) ? '키 입력 대기' : codeLabel(settings.bindings[a])) + '</button></div>';
        }).join('') +
        '<p id="binding-status" class="setting-note binding-status" role="status">' +
          (ui.bindingTarget ? '바꿀 키를 누르세요. Esc로 취소할 수 있어요.' : '방향키로도 움직일 수 있어요. Enter / Space도 상호작용에 쓸 수 있어요.') + '</p>' +
        '<button class="action secondary setting-reset" id="setting-keys-reset">기본 키로 되돌리기</button></section>' +
      '<section class="settings-section"><h3>마우스 / 터치</h3>' +
        '<p class="setting-note">땅 클릭·탭: 그곳으로 걷기<br>화면 끌기: 시점 돌리기 · 휠: 확대 / 축소<br>Esc: 열린 화면 닫기</p></section>' +
      '<section class="settings-section"><h3>계정</h3>' +
        '<button class="action secondary setting-reset" id="setting-logout">로그아웃</button></section>' +
      '<p class="info-note">설정은 이 브라우저에만 저장돼요.</p>';
  }

  function bindingFeedback(msg) { var s = $('#binding-status'); if (s) s.textContent = msg; }

  function bindSettings() {
    var on = function (sel, ev, fn) { var x = $(sel); if (x) x.addEventListener(ev, fn); };
    on('#setting-north', 'change', function (e) { settings.north = e.target.value === 'fixed'; applySettings(); persist(); });
    on('#setting-quality', 'change', function (e) {
      var want = e.target.value === 'high';
      var high = engine.setQuality(want);
      settings.quality = high ? 'high' : 'low';
      e.target.value = settings.quality;
      persist();
      if (want && !high) toast('이 기기에서는 가벼움 화질로 보여요.');
    });
    on('#setting-sound', 'change', function (e) { settings.muted = e.target.value === 'off'; applySettings(); persist(); });
    on('#setting-view', 'click', function () { if (engine) engine.resetView(); toast('시점을 처음 상태로 되돌렸어요'); });
    on('#setting-keys-reset', 'click', function () {
      settings.bindings = Object.assign({}, DEFAULT_BINDINGS);
      ui.bindingTarget = null;
      applySettings(); persist(); renderPhone();
      if (host.onKeysChanged) host.onKeysChanged();
      var b = $('#setting-keys-reset'); if (b) b.focus();
      toast('기본 키로 되돌렸어요');
    });
    on('#setting-logout', 'click', function () { closePanel(); host.logout(); });
    Array.prototype.forEach.call($('#overlay').querySelectorAll('[data-bind]'), function (b) {
      b.onclick = function () {
        ui.bindingTarget = ui.bindingTarget === b.dataset.bind ? null : b.dataset.bind;
        renderPhone();
        var again = $('#overlay [data-bind="' + b.dataset.bind + '"]'); if (again) again.focus();
      };
    });
  }

  function renderPhone() {
    var keepScroll = ui.page === 'settings' ? (($('#phone-content') || {}).scrollTop || 0) : 0;
    var body = ui.page === 'clubs' ? clubsHTML() : ui.page === 'missions' ? missionsHTML()
      : ui.page === 'contacts' ? contactsHTML() : ui.page === 'settings' ? settingsHTML()
      : ui.page === 'feedback' ? '<div id="fb-mount"></div>' : homeHTML();
    var now = new Date().toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
    $('#overlay').innerHTML =
      '<section class="phone-dialog" role="dialog" aria-modal="true" aria-labelledby="phone-title">' +
        '<div class="phone-status"><span>' + now + '</span><span class="phone-island"></span>' +
          '<span class="status-right">' + icon('signal') + icon('battery') + '</span></div>' +
        '<header class="phone-header">' +
          (ui.page !== 'home' ? '<button class="icon-btn" data-nav="home" aria-label="홈으로">' + icon('back') + '</button>' : '') +
          '<h2 id="phone-title">' + TITLES[ui.page] + '</h2>' +
          '<button class="icon-btn" data-close aria-label="휴대폰 닫기">' + icon('close') + '</button></header>' +
        '<div class="phone-content" id="phone-content">' + body + '</div>' +
        '<nav class="phone-nav" aria-label="휴대폰 메뉴">' + NAV.map(function (n) {
          var on = ui.page === n[0];
          return '<button data-nav="' + n[0] + '"' + (on ? ' class="active" aria-current="page"' : '') + '>' + icon(n[1]) + n[2] + '</button>';
        }).join('') + '</nav>' +
      '</section>';

    var o = $('#overlay');
    o.querySelector('[data-close]').onclick = closePanel;
    var each = function (sel, fn) { Array.prototype.forEach.call(o.querySelectorAll(sel), fn); };
    each('[data-nav]', function (b) { b.onclick = function () { phoneNavigate(b.dataset.nav); }; });
    each('[data-open-map]', function (b) { b.onclick = function () { closePanel(); openMap(); }; });
    each('[data-coco]', function (b) { b.onclick = openCocoFromNotice; });
    each('[data-contact]', function (b) {
      b.onclick = function () { if (b.dataset.contact === 'coco') readNotice(); contactNpc(b.dataset.contact); };
    });
    each('[data-room]', function (b) {
      b.onclick = function () {
        closePanel();
        if (b.dataset.room === 'mission') host.openMissionRoom(); else host.openClubRoom();
      };
    });
    each('[data-join-club]', function (b) { b.onclick = function () { joinClub(Number(b.dataset.joinClub), b); }; });
    each('[data-start]', function (b) { b.onclick = function () { startMission(Number(b.dataset.start), b); }; });
    each('[data-complete]', function (b) { b.onclick = function () { completeMission(Number(b.dataset.complete), b); }; });
    each('[data-fb-compose]', function (b) { b.onclick = function () { phoneNavigate('feedback', { compose: true }); focusFirst(); }; });
    if (ui.page === 'settings') { bindSettings(); $('#phone-content').scrollTop = keepScroll; }
    if (ui.page === 'feedback') mountFeedback();
  }

  // 내 의견함 화면 — 목록·대화·새 의견은 feedback.js가 그린다
  function mountFeedback() {
    var m = $('#fb-mount');
    if (!m) return;
    if (!hasFeedback()) { m.innerHTML = '<p class="record-empty">지금은 의견함을 열 수 없어요.</p>'; return; }
    var title = $('#phone-title');
    if (ui.fbCompose) {
      if (title) title.textContent = '마을에 건의하기';
      m.replaceChildren(window.Feedback.compose({
        sb: host.sb, channel: 'chief', place: null,
        onCancel: function () { phoneNavigate('feedback'); focusFirst(); }
      }));
    } else {
      m.replaceChildren(window.Feedback.inbox({
        sb: host.sb,
        onChange: setFbUnread,
        onCompose: function () { phoneNavigate('feedback', { compose: true }); focusFirst(); }
      }));
    }
  }

  // ---------------------------------------------------------------- 키보드
  function onKeyDown(e) {
    // 1) 키 바꾸기 대기 중 — 누른 키를 그 동작에 붙인다. 엔진으로 넘기지 않는다
    if (ui.bindingTarget) {
      if (e.key === 'Tab') return;
      e.preventDefault(); e.stopPropagation();
      if (e.key === 'Escape') { ui.bindingTarget = null; renderPhone(); return; }
      if (e.repeat || e.isComposing) return;
      var code = keyCode(e), action = ui.bindingTarget;
      if (e.ctrlKey || e.altKey || e.metaKey || e.shiftKey || !validCode(code)) { bindingFeedback('영문자 또는 숫자 키 하나를 눌러 주세요.'); return; }
      var dup = Object.keys(settings.bindings).filter(function (o) { return o !== action && settings.bindings[o] === code; })[0];
      if (dup) { bindingFeedback(codeLabel(code) + ' 키는 ' + KEY_NAMES[dup] + '에 쓰고 있어요.'); return; }
      settings.bindings[action] = code;
      ui.bindingTarget = null;
      applySettings(); persist(); renderPhone();
      if (host.onKeysChanged) host.onKeysChanged();
      var b = $('#overlay [data-bind="' + action + '"]'); if (b) b.focus();
      return;
    }
    if (e.isComposing) return;
    // 2) Esc — 열린 휴대폰·지도 닫기
    if (e.key === 'Escape' && ui.panel) { e.preventDefault(); closePanel(); return; }
    // 3) 지도 키
    var typing = e.target && e.target.matches && e.target.matches('input,textarea,select,[contenteditable="true"]');
    if (!typing && !e.ctrlKey && !e.altKey && !e.metaKey && !e.repeat && keyCode(e) === settings.bindings.map) {
      if (ui.panel === 'map') { e.preventDefault(); closePanel(); return; }
      if (!ui.panel && allowed() && host && !host.busy()) { e.preventDefault(); openMap(); return; }
    }
    // 인벤토리 키 — 앱 대화·튜토리얼 중에는 열지 않는다.
    if (!typing && !e.ctrlKey && !e.altKey && !e.metaKey && !e.repeat && keyCode(e) === settings.bindings.inventory && fishingFeature && allowed() && !host.busy()) {
      e.preventDefault(); fishingFeature.toggleInventory(); return;
    }
    // 4) 열린 화면 안에서 Tab 순환
    if (e.key === 'Tab' && ui.panel) {
      var a = Array.prototype.filter.call($('#overlay').querySelectorAll('button:not(:disabled),textarea,a[href],input,select'),
        function (x) { return x.offsetParent !== null; });
      if (!a.length) return;
      var first = a[0], last = a[a.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  }

  // ---------------------------------------------------------------- 공개 API
  function init(h) {
    host = h;
    document.querySelectorAll('[data-icon]').forEach(function (e) { e.innerHTML = icon(e.dataset.icon); });
    $('#phone-launch').onclick = function () { openPhone('home'); };
    $('#overlay').addEventListener('click', function (e) { if (e.target === $('#overlay')) closePanel(); });
    document.addEventListener('keydown', onKeyDown);
    applySettings();
    updateBadge();
  }
  function attach(e) {
    var uid = host && host.userId();
    if (fishingFeature && (engine !== e || fishingUser !== uid)) { fishingFeature.destroy(); fishingFeature = null; }
    engine = e;
    applySettings();
    if (!fishingFeature && uid && window.createFishingFeature) {
      fishingUser = uid;
      fishingFeature = window.createFishingFeature({
        engine: engine, ui: ui, openPanel: openPanel, closePanel: closePanel, setupFocus: focusFirst,
        toast: toast, icon: icon, keyLabel: codeLabel, allowed: allowed, isBusy: host.busy,
        storageKey: 'social-world-inventory-v1:' + encodeURIComponent(uid),
        economy: host.economy ? host.economy() : null
      });
    }
  }
  function sync(ctx) {
    ui.ctx = { inVillage: !!ctx.inVillage, tour: !!ctx.tour, roomBusy: !!ctx.roomBusy };
    $('#phone-launch').hidden = ui.ctx.tour || ui.ctx.roomBusy;
    if (ui.panel && !allowed()) closePanel();
    if (ui.ctx.tour) hideNotice();
    if (fishingFeature) { if (!allowed()) fishingFeature.cancel(); fishingFeature.updateHud(); }
    scheduleNotice();
    if (ui.ctx.inVillage && !ui.ctx.tour && ui.fbUser !== host.userId()) checkFeedback(true);   // 로그인마다 한 번
  }
  function reset() {
    closePanel();
    if (fishingFeature) fishingFeature.destroy();
    fishingFeature = null; fishingUser = null;
    hideNotice();
    clearTimeout(ui.noticeTimer); ui.noticeTimer = null;
    ui.notice = null; ui.noticeUser = null;
    ui.fbUnread = 0; ui.fbUser = null;
    updateBadge();
  }

  window.WorldUI = {
    init: init,
    attach: attach,
    sync: sync,
    reset: reset,
    close: closePanel,
    isOpen: function () { return !!ui.panel; },
    keyLabel: function (action) { return codeLabel(settings.bindings[action] || DEFAULT_BINDINGS[action] || ''); },
    openPhone: openPhone,
    openMap: openMap,
    target: function(t){ return fishingFeature ? fishingFeature.target(t) : t; },
    interactFishing: function(options){ return fishingFeature ? fishingFeature.interact(options) : false; },
    tick: function(){ if (fishingFeature) fishingFeature.tick(); },
    cancelFishing: function(){ if (fishingFeature) fishingFeature.cancel(); },
    isFishing: function(){ return !!(fishingFeature && fishingFeature.state); },
    openInventory: function(){ if (fishingFeature) fishingFeature.toggleInventory(); },
    get fishing(){ return fishingFeature; },
    state: ui            // 테스트·디버그용
  };
})();

</script>
<!-- market.js -->
<script>
/* Market services, online economy and local chat; bus presentation. */
(function (root) {
  'use strict';
  let host = null, travelling = false, destination = null, service = null, focusBefore = null;
  let chat = null, speech = null, speechUntil = 0, composing = false;
  let chatFrame = null, manipulation = null;
  const chatHistory = [];
  const marketModes = ['market', 'bank', 'clothing'];
  function chatAvailable() {
    const e = host?.engine();
    return !!e?.isRunning() && marketModes.includes(e.mode()) && !travelling && !service && !host.blocked() && !host.tutorial() && !root.WorldUI?.isOpen();
  }
  function isTyping() { return !!chat && !chat.hidden && document.activeElement === chat.querySelector('input'); }
  function clearSpeech() { speech?.remove(); speech = null; speechUntil = 0; }
  function expandChat(expanded, focus = false) {
    if (!chat) return;
    chat.classList.toggle('is-collapsed', !expanded);
    const button = chat.querySelector('#market-chat-toggle'); button.setAttribute('aria-expanded', String(expanded));
    button.querySelector('.market-chat-chevron').textContent = expanded ? '−' : '+';
    if (!expanded && isTyping()) chat.querySelector('input').blur();
    host?.engine()?.pauseInput();
    placeChatAboveKeyboard();
    if (focus) chat.querySelector('input').focus();
  }
  function createChat() {
    chat = document.createElement('section'); chat.id = 'market-chat'; chat.setAttribute('aria-label', '시장 채팅');
    chat.innerHTML = '<div id="market-chat-header" tabindex="0" aria-label="시장 채팅창 이동"><span class="market-chat-symbol" aria-hidden="true">' +
      '<svg viewBox="0 0 24 24"><path d="M5 4h14a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2h-8l-6 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7 9h10M7 13h6"/></svg></span>' +
      '<strong>시장 채팅</strong><button type="button" id="market-chat-toggle" aria-expanded="true" aria-controls="market-chat-content" aria-label="채팅창 접기 또는 펼치기"><span class="market-chat-chevron" aria-hidden="true">−</span></button></div>' +
      '<div id="market-chat-content"><div id="market-chat-log" role="log" aria-live="polite" aria-relevant="additions"><p class="market-chat-empty">시장에서 나누고 싶은 말을 남겨 보세요.</p></div>' +
      '<form id="market-chat-form"><label class="market-sr-only" for="market-chat-input">시장 채팅 메시지</label><input id="market-chat-input" name="message" type="text" maxlength="80" autocomplete="off" placeholder="메시지 입력…" enterkeyhint="send"><button type="submit" aria-label="메시지 보내기">보내기</button></form>' +
      '<p class="market-chat-hint">Enter로 입력 · Esc로 입력 종료 · 최대 80자</p></div>' +
      ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'].map(edge => '<span class="market-chat-resize resize-' + edge + '" data-edge="' + edge + '" aria-hidden="true"></span>').join('');
    document.body.append(chat);
    chat.querySelector('#market-chat-toggle').onclick = () => expandChat(chat.classList.contains('is-collapsed'));
    chat.querySelector('#market-chat-header').addEventListener('pointerdown', e => {
      if (!e.target.closest('button')) startManipulation(e, 'move');
    });
    for (const handle of chat.querySelectorAll('[data-edge]')) handle.addEventListener('pointerdown', e => startManipulation(e, handle.dataset.edge));
    chat.addEventListener('pointermove', moveChat);
    chat.addEventListener('pointerup', endManipulation);
    chat.addEventListener('pointercancel', endManipulation);
    chat.addEventListener('lostpointercapture', endManipulation);
    chat.querySelector('#market-chat-header').addEventListener('keydown', e => {
      const steps = { ArrowLeft: [-12, 0], ArrowRight: [12, 0], ArrowUp: [0, -12], ArrowDown: [0, 12] };
      if (e.target.id !== 'market-chat-header' || !steps[e.key]) return;
      e.preventDefault(); e.stopPropagation();
      const b = chat.getBoundingClientRect();
      if (!chatFrame) chatFrame = { x: b.x, y: b.y, w: b.width, h: chat.classList.contains('is-collapsed') ? defaultChatHeight() : b.height };
      chatFrame.x += steps[e.key][0]; chatFrame.y += steps[e.key][1];
      placeChatAboveKeyboard(); host?.engine()?.pauseInput();
    });
    const input = chat.querySelector('input');
    input.onfocus = () => host?.engine()?.pauseInput();
    input.onblur = () => { composing = false; };
    input.addEventListener('compositionstart', () => { composing = true; });
    input.addEventListener('compositionend', () => { composing = false; });
    input.onkeydown = e => {
      if (e.key === 'Enter' && (composing || e.isComposing || e.keyCode === 229)) { e.preventDefault(); e.stopPropagation(); }
    };
    chat.querySelector('form').onsubmit = e => {
      e.preventDefault(); if (composing || !chatAvailable()) return;
      const text = Array.from(input.value.replace(/[\u0000-\u001F\u007F]/g, ' ').trim()).slice(0, 80).join('');
      if (!text) return;
      const now = new Date(), nickname = String(host.nickname?.() || '나');
      const message = { nickname, text, portrait: host.portrait?.() || '', time: String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0') };
      chatHistory.push(message); if (chatHistory.length > 30) chatHistory.shift();
      appendChatMessage(message); input.value = ''; input.focus();
      clearSpeech(); speech = document.createElement('div'); speech.id = 'market-chat-bubble'; speech.setAttribute('aria-hidden', 'true');
      speech.textContent = text; document.body.append(speech);
      speechUntil = performance.now() + Math.max(5000, Math.min(9000, Array.from(text).length * 70 + 2500));
      drawSpeech();
    };
    renderChatHistory();
    expandChat(!(root.matchMedia && root.matchMedia('(max-width: 600px)').matches));
  }
  function renderChatHistory() {
    const log = chat?.querySelector('#market-chat-log'); if (!log || !chatHistory.length) return;
    log.replaceChildren();
    for (const message of chatHistory) appendChatMessage(message);
  }
  function appendChatMessage(message) {
    const log = chat?.querySelector('#market-chat-log'); if (!log) return;
    log.querySelector('.market-chat-empty')?.remove();
    const row = document.createElement('div'); row.className = 'market-chat-message';
    const photo = document.createElement('img'); photo.className = 'market-chat-avatar'; photo.src = message.portrait; photo.alt = message.nickname + ' 캐릭터 프로필'; photo.width = photo.height = 30;
    const content = document.createElement('div'); content.className = 'market-chat-message-content';
    const name = document.createElement('strong'); name.textContent = message.nickname;
    const time = document.createElement('time'); time.textContent = message.time;
    const body = document.createElement('p'); body.textContent = message.text;
    content.append(name, time, body); row.append(photo, content); log.append(row);
    while (log.children.length > 30) log.firstElementChild.remove();
    log.scrollTop = log.scrollHeight;
  }
  function syncChat() {
    const e = host?.engine(), inMarket = !!e?.isRunning() && marketModes.includes(e.mode()) && !travelling;
    if (inMarket && !chat) createChat();
    if (chat) {
      const available = chatAvailable();
      if (!available && manipulation) endManipulation();

  function refreshProfile(){

  // DB에 캐릭터·관심사·가입목표 칸(03_world_update.sql)이 없던 시절 이 브라우저에만 남겨둔 값을,
  // 칸이 생긴 뒤 처음 들어올 때 DB로 옮긴다. DB에 이미 값이 있으면 덮어쓰지 않는다.
  function syncLocalProfile(){
    var p = state.profile;
    if(!p || !("avatar" in p)) return Promise.resolve();          // 칸이 아직 없으면 그대로 둔다
    var patch = {}, localAv = null, extra = null;
    try { var r1 = localStorage.getItem(avatarKey()); if(r1) localAv = JSON.parse(r1); } catch(e){}
    try { var r2 = localStorage.getItem(extraKey());  if(r2) extra   = JSON.parse(r2); } catch(e){}
    if(!p.avatar && localAv) patch.avatar = localAv;
    if(extra){
      if((!p.interests || !p.interests.length) && extra.interests && extra.interests.length) patch.interests = extra.interests;
      if(!p.join_goal && extra.join_goal) patch.join_goal = extra.join_goal;
    }
    if(!Object.keys(patch).length) return Promise.resolve();
    return sb.from("profiles").update(patch).eq("id", p.id).then(function(res){
      if(res.error){ console.warn("브라우저 보관값을 DB로 옮기지 못했습니다(다음 접속 때 다시 시도):", res.error.message); return; }
      Object.assign(p, patch);
      try { localStorage.removeItem(avatarKey()); localStorage.removeItem(extraKey()); } catch(e){}
    });
  }

  function presetAvatar(vibe, color, seed){

    return { vibe:vibe, color:color, hair:p.hair, hairColor:p.hairColor,
             skin:AV_OPTS.skin[hsh % AV_OPTS.skin.length].v, outfit:color || "#4caf6e", acc:p.acc, face:p.face };

  // ---------------- ① 사전 설문 ----------------
  function startSurvey(){
    state.ob = { step:0, answers:{ interests:[] }, avatar:null, editOnly:false };
    state.view = "survey";
    render();
  }

  function surveyNext(){
    if(state.ob.step < SURVEY.length - 1){ state.ob.step += 1; renderSurvey(); }
    else {
      var a = state.ob.answers;
      state.ob.avatar = presetAvatar(a.vibe, a.color, a.nickname);
      state.view = "character"; render();
    }
  }

  function renderSurvey(){
    app.innerHTML = "";
    var ob = state.ob, st = SURVEY[ob.step], a = ob.answers;
    var pct = Math.round((ob.step) / SURVEY.length * 100);
    var body = "", canNext = false;
    if(st.type === "text"){
      body = '<input class="survey-input" id="sv-text" maxlength="20" placeholder="예: 느긋한고양이" value="'+esc(a.nickname||"")+'">';
    } else if(st.type === "single"){
      body = '<div class="choice-list">' + st.choices.map(function(c){
        var on = a[st.key] === c.v;
        return '<button class="choice'+(on?" on":"")+'" data-v="'+esc(c.v)+'" aria-pressed="'+on+'">'+esc(c.label)+'</button>';
      }).join("") + '</div>';
    } else if(st.type === "multi"){
      var sel = a[st.key] || [];
      body = '<div class="chips">' + st.choices.map(function(c){
        var on = sel.indexOf(c) >= 0;
        return '<button class="chip" data-v="'+esc(c)+'" aria-pressed="'+on+'">'+esc(c)+'</button>';
      }).join("") + '</div><p class="survey-count">'+sel.length+' / '+st.max+'</p>';
      canNext = sel.length > 0;
    } else if(st.type === "look"){
      body = '<div class="vibe-grid">' + VIBES.map(function(v){
        var on = a.vibe === v.v;
        return '<button class="vibe'+(on?" on":"")+'" data-vibe="'+v.v+'" aria-pressed="'+on+'"><span class="vibe-emoji">'+v.emoji+'</span>'+esc(v.label)+'</button>';
      }).join("") + '</div>' +
      '<p class="survey-mini">좋아하는 색</p><div class="swatches">' + COLORS.map(function(c){
        var on = a.color === c.v;
        return '<button class="swatch'+(on?" on":"")+'" data-color="'+c.v+'" style="background:'+c.v+'" aria-label="'+esc(c.label)+'" aria-pressed="'+on+'"></button>';
      }).join("") + '</div>';
      canNext = !!(a.vibe && a.color);
    }
    var showNext = st.type === "text" || st.type === "multi" || st.type === "look";
    app.appendChild(h(
      '<div class="center-screen">' +
        '<div class="pixel-panel survey-card">' +
          '<div class="survey-step"><span>'+(ob.step+1)+' / '+SURVEY.length+'</span><span>'+(st.required?"필수":"건너뛰어도 돼요")+'</span></div>' +
          '<div class="survey-progress"><span style="width:'+pct+'%"></span></div>' +
          '<h1 class="survey-q">'+esc(st.q)+'</h1>' +
          '<p class="survey-sub">'+esc(st.sub)+'</p>' + body +
          '<div class="survey-nav">' +
            (ob.step > 0 ? '<button class="btn-ghost" id="sv-back">← 이전</button>' : '<span></span>') +
            '<div class="survey-nav-right">' +
              (!st.required ? '<button class="btn-ghost" id="sv-skip">건너뛰기</button>' : '') +
              (showNext ? '<button class="btn btn-primary btn-auto" id="sv-next"'+(st.type==="text"||canNext?"":" disabled")+'>다음</button>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>'
    ));
    var back = el("#sv-back"); if(back) back.addEventListener("click", function(){ ob.step -= 1; renderSurvey(); });
    var skip = el("#sv-skip"); if(skip) skip.addEventListener("click", function(){
      if(st.type === "multi") a[st.key] = []; else delete a[st.key];
      surveyNext();
    });
    if(st.type === "text"){
      var inp = el("#sv-text"); inp.focus();
      var go = function(){
        var v = inp.value.trim();
        if(!v){ inp.classList.add("shake"); inp.setAttribute("aria-invalid","true"); inp.placeholder = "이름을 입력해 주세요"; return; }
        a.nickname = v; surveyNext();
      };
      el("#sv-next").addEventListener("click", go);
      inp.addEventListener("keydown", function(e){ if(e.key === "Enter"){ e.preventDefault(); go(); } });
    } else if(st.type === "single"){
      Array.prototype.forEach.call(app.querySelectorAll(".choice"), function(b){
        b.addEventListener("click", function(){ a[st.key] = b.getAttribute("data-v"); surveyNext(); });
      });
    } else if(st.type === "multi"){
      Array.prototype.forEach.call(app.querySelectorAll(".chip"), function(b){
        b.addEventListener("click", function(){
          var v = b.getAttribute("data-v"), list = a[st.key] || (a[st.key] = []), i = list.indexOf(v);
          if(i >= 0) list.splice(i,1); else if(list.length < st.max) list.push(v);
          renderSurvey();
        });
      });
      el("#sv-next").addEventListener("click", surveyNext);
    } else if(st.type === "look"){
      Array.prototype.forEach.call(app.querySelectorAll("[data-vibe]"), function(b){
        b.addEventListener("click", function(){ a.vibe = b.getAttribute("data-vibe"); renderSurvey(); });
      });
      Array.prototype.forEach.call(app.querySelectorAll("[data-color]"), function(b){
        b.addEventListener("click", function(){ a.color = b.getAttribute("data-color"); renderSurvey(); });
      });
      el("#sv-next").addEventListener("click", surveyNext);
    }
  }

    el("#ch-done").addEventListener("click", function(){
      var btn = this; btn.disabled = true; btn.textContent = "저장 중…";
      (ob.editOnly ? saveAvatarOnly(av) : saveProfileFromSurvey()).then(function(ok){

  // 저장 — 팀 DB에 03_world_update.sql(avatar·interests·join_goal 칸)이 아직 없으면
  // 기본 칸만 DB에 저장하고 캐릭터·관심사·가입목표는 이 브라우저에 보관한다(프로토타입 폴백).
  // 칸이 생긴 뒤 첫 접속 때 syncLocalProfile()이 DB로 옮긴다.
  function isMissingColumn(err){ return err && /column|schema cache/i.test(err.message || ""); }
  function keepAvatarLocally(av){ try { localStorage.setItem(avatarKey(), JSON.stringify(av)); } catch(e){} }
  function extraKey(){ return "sw_profile_extra_" + (state.session ? state.session.user.id : "guest"); }
  function keepExtraLocally(x){ try { localStorage.setItem(extraKey(), JSON.stringify(x)); } catch(e){} }

  function saveProfileFromSurvey(){
    var a = state.ob.answers, av = state.ob.avatar;
    state.tutorialCtx = { mood: a.mood || null, goal: a.goal || null, interests: a.interests || [] };   // 말투용 — 저장 안 함
    var base = { id: state.session.user.id, nickname: a.nickname, sgg_code: a.sgg, age_group: a.age,
                 gender: a.gender, onboarded_at: new Date().toISOString() };
    var full = Object.assign({}, base, { avatar: av, interests: a.interests || [], join_goal: a.goal || null });
    return sb.from("profiles").upsert(full).then(function(res){
      if(!res.error) return true;
      if(!isMissingColumn(res.error)){ alert("저장에 실패했습니다: " + res.error.message); return false; }
      console.warn("profiles에 튜토리얼 칸이 없어 기본 정보만 DB에 저장합니다(03_world_update.sql 적용 전).");
      keepAvatarLocally(av);
      keepExtraLocally({ interests: a.interests || [], join_goal: a.goal || null });
      showToast("캐릭터·관심사는 이 브라우저에 임시 보관했어요. DB 준비가 끝나면 다음 접속 때 자동으로 옮겨져요.");
      return sb.from("profiles").upsert(base).then(function(r2){
        if(r2.error){ alert("저장에 실패했습니다: " + r2.error.message); return false; }
        return true;
      });
    }).then(function(ok){
      if(!ok) return false;
      return refreshProfile().then(loadFeedback).then(function(){ return true; });
    });
  }

  function saveAvatarOnly(av){
    return sb.from("profiles").update({ avatar: av }).eq("id", state.session.user.id).then(function(res){
      if(res.error && !isMissingColumn(res.error)){ alert("저장에 실패했습니다: " + res.error.message); return false; }
      if(res.error) keepAvatarLocally(av);
      return refreshProfile().then(function(){ return true; });
    });
  }

  function updateHud(){
    var E = ENGINE; if(!E || !E.isRunning()) return;
    var inRoom = state.view === "room", inMarket = state.view.indexOf("market") === 0, marketIndoor = inMarket && state.view !== "market";
    var travelling = !!(window.MarketUI && window.MarketUI.isTravelling());
    document.querySelector(".hud-title h1").textContent = inMarket ? "이음 시장" : "이음 마을";
    hud("hud-sub").textContent = inMarket ? (state.view === "market-bank" ? "이음 은행" : state.view === "market-clothing" ? "오늘의 옷장" : "시장 광장 · " + nick() + "님") : inRoom ? nick() + "의 방" : (state.tour ? "루미와 마을 한 바퀴" : "광장 · " + nick() + "님");
    var busyRoom = inRoom && state.room && state.room.phase !== "free";
    hud("hud-room").hidden = !inRoom || busyRoom;
    var mmc = hud("hud-minimap"); if(mmc) mmc.hidden = inRoom || marketIndoor;
    hud("hud-help").hidden = !!state.tour || busyRoom;
    var move = esc(key("forward") + key("left") + key("back") + key("right")), ek = esc(key("interact"));
    hud("hud-help").innerHTML = inRoom
      ? '<b>' + move + '</b> 이동 · <b>끌기</b> 시점 · 문 앞에서 <b>' + ek + '</b>'

    if(window.WorldUI) window.WorldUI.sync({ inVillage: E.mode() === "village", tour: !!state.tour, roomBusy: busyRoom || travelling });

  function onWorldAction(t){
    if(worldBlocked()) return;
    if(state.tour){
      if(state.tour.arrived) tourAdvance();
      else showToast("루미를 따라가 보세요 — '루미 따라가기'를 누르면 자동으로 걸어가요");
      return;
    }
    if(state.view === "room" && state.room && state.room.phase !== "free") return;
    if(window.WorldUI && window.WorldUI.interactFishing({ hiddenOnly: true })) return;
    if(!t) return;
    if(t.type === "fishing"){ if(window.WorldUI) window.WorldUI.interactFishing(); return; }
    if(t.type === "bus"){ if(window.MarketUI) window.MarketUI.ride(); return; }
    if(t.type === "service"){ if(window.MarketUI) window.MarketUI.openService(ENGINE.mode()); return; }
    if(t.type === "npc") openNpc(t.id);
    else doorAction(t.id);
  }

  function doorAction(id){
    var P = ENGINE.places();
    if(id === "market-bank" || id === "market-clothing"){ state.view = id; state.near = null; render(); }
    else if(id === "bank-exit" || id === "clothing-exit"){ state.spawn = P[id === "bank-exit" ? "market-bank" : "market-clothing"]; state.view = "market"; state.near = null; render(); }
    else if(id === "mission"){ state.spawn = P.mission; loadMissionRoom(); }
    else if(id === "club"){ state.spawn = P.club; loadClubRoom(); }
    else if(id === "home"){ openRoom(false); }
    else if(id === "room-door"){ state.spawn = P.home; state.view = "plaza"; render(); }
    else if(STUB_MSG[id]) showToast(STUB_MSG[id]);
  }

  function renderPlaza(){

    if(state.activeNpc) renderNpcModal();
  }

    var mode = state.view === "market-bank" ? "bank" : state.view === "market-clothing" ? "clothing" : "market";
    var spawn = state.spawn, facing = state.spawnFacing;
    state.spawn = null; state.spawnFacing = null; state.near = null;
    if(mode !== "market") spawn = ENGINE.places()[mode + "-inside"];

    showWorld(mode, { spawn: spawn, facing: facing != null ? facing : Math.PI, resetView: true });

    state.worldReturn = { spawn: mode === "market" ? ENGINE.playerPos() : ENGINE.places()[mode === "bank" ? "market-bank" : "market-clothing"] };
  }

  // ---------------- ③ 내 방 (3D 실내) ----------------

    var tutorial = state.room.phase === "wake";
    if(!showWorld("room", tutorial ? { spawnPlace: "bedside", seated: true, sleeping: true } : { spawnPlace: "roomMid", facing: 0 })) return;
    var E = ENGINE;
    if(tutorial){
      var token = state.room;
      setTimeout(function(){ if(state.room !== token || state.view !== "room") return; E.wake(); }, 1700);
      setTimeout(function(){ if(state.room !== token || state.view !== "room") return; lumiEntersRoom(); }, 2400);
    } else if(state.room.dialog){ renderTutorial(); }
  }

  // 루미가 문을 두드리고 걸어 들어온다

    var E = ENGINE, P = E.places(), token = state.room;

      }, { direct: true, speed: 2.4 });

  // ---------------- 루미와 함께 걷는 마을 투어 ----------------
  var TOUR_STOPS = {
