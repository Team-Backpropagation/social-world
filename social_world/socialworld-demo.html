<!doctype html>
<!-- 자동 생성 파일 — 직접 고치지 마세요. 원본: social_world/app/ (index.html·app.js·ui.js·world-engine.js·*.css). 다시 만들기: python social_world/app/bundle.py -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>소셜 월드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Gowun+Batang:wght@700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
<style>
/* 앱 기본 스타일 — 원래 socialworld-demo.html의 <style> */
  :root{
    --bg:#fff8e7;
    --surface:#ffffff;
    --surface-2:#f7f7f2;
    --ink:#2b2b2b;
    --ink-soft:#5b5b52;
    --green-dark:#2f7a4f;
    --green:#4caf6e;
    --green-light:#a8e6a1;
    --blue:#5b8def;
    --blue-soft:#e6f0ff;
    --gold:#e0c14a;
    --gold-soft:#fff2c9;
    --pink:#a34;
    --border:#2b2b2b;
    --shadow:rgba(0,0,0,.25);
    --kakao:#fee500;
    --kakao-ink:#3c1e1e;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:var(--bg);
    color:var(--ink);
    font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
    padding-inline:16px;
  }
  .pixel-font{font-family:'Press Start 2P',monospace}
  button{font-family:inherit;cursor:pointer}
  a{color:inherit}

  #banner{
    max-width:640px;margin:14px auto 0;padding:10px 14px;border:2px solid var(--border);
    border-radius:10px;background:var(--gold-soft);font-size:12.5px;line-height:1.6;color:var(--ink);
  }
  #banner b{color:var(--green-dark)}

  #app{max-width:960px;margin:0 auto;padding-block:20px 40px}

  .btn{
    display:block;width:100%;padding:12px 16px;margin-top:10px;border:3px solid var(--border);
    border-radius:10px;background:var(--surface);color:var(--ink);font-size:15px;font-weight:700;
    box-shadow:3px 3px 0 var(--shadow);transition:transform .08s ease;
  }
  .btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
  .btn:disabled{opacity:.55;cursor:not-allowed}
  .btn-primary{background:var(--green);color:#fff}
  .btn-kakao{background:var(--kakao);color:var(--kakao-ink)}
  .btn-option{background:var(--blue);color:#fff;margin-top:8px}
  .btn-ghost{background:transparent;border:none;box-shadow:none;color:var(--green-dark);font-weight:700;
    text-decoration:underline;padding:6px 8px;width:auto}
  .btn-auto{width:auto;margin-top:0}

  .pixel-panel{background:var(--surface);border:4px solid var(--border);border-radius:14px;
    box-shadow:6px 6px 0 var(--shadow);padding:22px}

  .center-screen{min-height:70vh;display:flex;align-items:center;justify-content:center;padding-block:24px}
  .login-card{max-width:380px;width:100%;text-align:center}
  .login-logo{font-size:44px}
  .login-card h1,.onboarding-card h1{font-family:'Press Start 2P',monospace;font-size:19px;
    color:var(--green-dark);margin:8px 0;text-wrap:balance}
  .login-sub{color:var(--ink-soft);margin-bottom:16px}
  .terms{margin-top:16px;font-size:11.5px;color:var(--ink-soft);line-height:1.6}
  .demo-note{margin-top:12px;font-size:11.5px;color:var(--ink-soft);background:var(--surface-2);
    border-radius:8px;padding:8px 10px;line-height:1.6}

  .onboarding-card{max-width:420px;width:100%;display:flex;flex-direction:column;gap:10px}
  .onboarding-card label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px;margin-top:6px}
  .onboarding-card input,.onboarding-card select,.club-form input,.club-form select,.club-form textarea{
    font-family:inherit;font-size:15px;padding:10px 12px;border:2px solid var(--border);border-radius:8px;
    background:var(--surface);color:var(--ink);width:100%;
  }

  .topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 4px;
    border-bottom:3px solid var(--border);margin-bottom:16px}
  .topbar-title{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px}
  .topbar-right{display:flex;align-items:center;gap:12px;font-size:13.5px}
  .topbar-nick{font-weight:700;color:var(--green-dark)}

  .plaza-map{position:relative;width:100%;aspect-ratio:900/560;border-radius:14px;border:4px solid var(--border);
    overflow:hidden;box-shadow:6px 6px 0 var(--shadow);
    background:repeating-conic-gradient(var(--green) 0% 25%, var(--green-light) 0% 50%) 0 0/8% 12.5%;
  }
  .plaza-deco{position:absolute;transform:translate(-50%,-50%);font-size:clamp(18px,3.5vw,30px);
    pointer-events:none;filter:drop-shadow(1px 2px 0 rgba(0,0,0,.25))}
  .plaza-sprite{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;
    align-items:center;gap:4px;background:none;border:none;padding:0}
  .plaza-sprite-icon{font-size:clamp(22px,4vw,34px);line-height:1;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3))}
  .plaza-npc-icon{border-radius:50%;padding:6px;display:inline-flex;border:3px solid var(--border)}
  .plaza-sprite-label{font-size:11px;font-weight:800;background:var(--surface);color:var(--ink);
    border:2px solid var(--border);border-radius:6px;padding:1px 6px;white-space:nowrap}
  .plaza-player{position:absolute;transform:translate(-50%,-50%);transition:left .08s linear,top .08s linear;
    display:flex;flex-direction:column;align-items:center}
  .plaza-player-icon{font-size:clamp(24px,4.5vw,36px);filter:drop-shadow(2px 2px 0 rgba(0,0,0,.35))}
  .plaza-player-shadow{width:22px;height:8px;border-radius:50%;background:rgba(0,0,0,.3);margin-top:-4px}
  .plaza-toast{position:absolute;bottom:100%;left:50%;transform:translateX(-50%);margin-bottom:6px;
    background:var(--border);color:#fff;font-size:11px;font-weight:700;padding:4px 8px;border-radius:6px;
    white-space:nowrap}
  .plaza-hint{text-align:center;font-size:12.5px;color:var(--ink-soft);margin-top:10px}

  .dpad{display:none;flex-direction:column;align-items:center;gap:4px;margin:14px auto 0;width:fit-content}
  .dpad-row{display:flex;gap:4px}
  .dpad button{width:46px;height:46px;font-size:18px;border:3px solid var(--border);border-radius:10px;
    background:var(--surface);color:var(--ink);box-shadow:3px 3px 0 var(--shadow)}
  .dpad-interact{background:var(--green) !important;color:#fff}
  @media (max-width:680px){.dpad{display:flex}}

  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;
    justify-content:center;padding:16px;z-index:50}
  .npc-modal{max-width:420px;width:100%;border-width:5px}
  .npc-modal-header{display:flex;align-items:flex-start;gap:10px;margin-bottom:12px}
  .npc-modal-emoji{font-size:22px;border-radius:50%;padding:6px 8px;border:3px solid var(--border)}
  .npc-modal-name{font-weight:800;font-size:16px}
  .npc-modal-disclaimer{font-size:11px;color:var(--pink);margin-top:2px}
  .npc-modal-close{margin-left:auto;font-size:16px}
  .npc-modal-text{line-height:1.65;background:var(--surface-2);border-radius:8px;padding:12px}
  .npc-modal-options{display:flex;flex-direction:column}
  .crisis-box{margin:12px 0 4px;padding:12px 14px;border:3px solid #d64545;border-radius:8px;background:#fff5f5;color:#3a1515}
  .crisis-title{font-weight:800;margin-bottom:6px}
  .crisis-line{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin:4px 0}
  .crisis-num{font-size:20px;font-weight:800;color:#c0392b;user-select:all;letter-spacing:.02em}
  .crisis-sub{font-size:12px;color:#7a4a4a}
  .plaza-npc-rec .plaza-npc-icon{box-shadow:0 0 0 4px rgba(255,214,102,.9);animation:recpulse 1.6s ease-in-out infinite}
  .plaza-rec-bubble{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px);white-space:nowrap;
    background:#fff;border:2px solid var(--border);border-radius:10px;padding:2px 8px;font-size:11px;font-weight:700;color:var(--ink)}
  @keyframes recpulse{0%,100%{box-shadow:0 0 0 3px rgba(255,214,102,.9)}50%{box-shadow:0 0 0 8px rgba(255,214,102,.35)}}
  @media (prefers-reduced-motion: reduce){.plaza-npc-rec .plaza-npc-icon{animation:none}}
  .mission-rec{font-size:11px;font-weight:800;background:#fff3c4;border:1px solid #e0b020;color:#6b5000;border-radius:6px;padding:1px 6px}

  .room-wrap{max-width:720px;margin:0 auto}
  .room-desc{color:var(--ink-soft);line-height:1.65}
  .room-header-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}

  .mission-list,.club-list{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-direction:column;gap:12px}
  .mission-item,.club-item{display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;padding:16px}
  .mission-item-main,.club-item-main{flex:1 1 240px}
  .mission-title{font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .mission-reward{font-size:12px;background:var(--gold-soft);border:1px solid var(--gold);border-radius:6px;
    padding:1px 6px}
  .club-category{font-size:12px;background:var(--blue-soft);border:1px solid var(--blue);color:var(--blue);
    border-radius:6px;padding:1px 6px}
  .mission-desc{font-size:13px;color:var(--ink-soft);margin:6px 0 0}
  .club-member-count{font-size:12px;color:var(--ink-soft);margin:6px 0 0}
  .badge-done{font-size:13px;font-weight:700;color:var(--green-dark)}

  .club-form{margin-top:14px;display:flex;flex-direction:column;gap:10px}
  .club-form label{display:flex;flex-direction:column;gap:6px;font-weight:700;font-size:14px}


  /* ---------- 튜토리얼 (2026-09-29) ---------- */
  .survey-card{max-width:460px;width:100%}
  .survey-step{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-soft);margin-bottom:6px}
  .survey-progress{height:10px;background:var(--surface-2);border:2px solid var(--border);border-radius:6px;overflow:hidden}
  .survey-progress>span{display:block;height:100%;background:var(--green);transition:width .25s ease}
  .survey-q{font-size:20px;font-weight:800;margin:16px 0 6px;line-height:1.4;text-wrap:balance}
  .survey-sub{font-size:13px;color:var(--ink-soft);line-height:1.65;margin:0 0 12px}
  .survey-mini{font-size:13px;font-weight:700;margin:14px 0 8px}
  .survey-count{font-size:12px;color:var(--ink-soft);margin:8px 0 0}
  .survey-input{font-family:inherit;font-size:16px;padding:12px;border:2px solid var(--border);border-radius:8px;
    background:var(--surface);color:var(--ink);width:100%}
  .survey-input[aria-invalid="true"]{border-color:#d64545}
  .choice-list{display:flex;flex-direction:column;gap:8px}
  .choice{text-align:left;padding:12px 14px;border:3px solid var(--border);border-radius:10px;background:var(--surface);
    color:var(--ink);font-size:15px;font-weight:700;box-shadow:3px 3px 0 var(--shadow)}
  .choice.on,.vibe.on{background:var(--green);color:#fff}
  .choice:focus-visible,.chip:focus-visible,.vibe:focus-visible,.swatch:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 14px;border:2px solid var(--border);border-radius:999px;background:var(--surface);color:var(--ink);font-weight:700;font-size:14px}
  .chip[aria-pressed="true"]{background:var(--green);color:#fff}
  .vibe-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vibe{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px;border:3px solid var(--border);border-radius:10px;
    background:var(--surface);color:var(--ink);font-weight:800;font-size:15px}
  .vibe-emoji{font-size:26px}
  .swatches{display:flex;flex-wrap:wrap;gap:10px}
  .swatch{width:40px;height:40px;border-radius:50%;border:3px solid var(--border)}
  .swatch.on{outline:3px solid var(--ink);outline-offset:3px}
  .survey-nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:18px;flex-wrap:wrap}
  .survey-nav-right{display:flex;align-items:center;gap:6px;margin-left:auto}
  .char-card{max-width:480px}
  .char-preview{display:flex;justify-content:center;background:var(--gold-soft);border:2px solid var(--border);border-radius:12px;padding:10px}
  .char-name{text-align:center;font-weight:800;margin:8px 0 4px}
  .part-row{display:grid;grid-template-columns:78px 40px 1fr 40px;align-items:center;gap:6px;margin-top:8px}
  .part-name{font-size:13px;font-weight:700;color:var(--ink-soft)}
  .part-row button{height:36px;border:2px solid var(--border);border-radius:8px;background:var(--surface);color:var(--ink);font-weight:800}
  .part-val{display:flex;align-items:center;justify-content:center;gap:6px;font-weight:700;font-size:14px}
  .dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);display:inline-block}
  .room-map{position:relative;width:100%;aspect-ratio:900/560;border-radius:14px;border:4px solid var(--border);overflow:hidden;
    box-shadow:6px 6px 0 var(--shadow);background:repeating-linear-gradient(90deg,#d9a86c 0 9%,#cf9a5c 9% 18%)}
  .room-wall{position:absolute;left:0;right:0;top:0;height:26%;background:#f3e2c7;border-bottom:4px solid #b88652}
  .room-rug{position:absolute;left:36%;top:48%;width:28%;height:26%;border-radius:50%;background:#e9c46a;opacity:.55;border:3px dashed #b88652}
  .room-big{font-size:clamp(30px,6vw,52px)}
  .room-lumi{pointer-events:none;transition:top .6s ease}
  .plaza-player-icon svg{display:block}
  .sleeping{animation:sleep 1.6s ease-in-out infinite}
  @keyframes sleep{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(-2deg)}}
  @media (prefers-reduced-motion: reduce){.sleeping{animation:none}}
  .room-actions{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin-top:12px}
  .room-actions .btn{margin-top:0}
  .tut-details summary{cursor:pointer;font-size:12.5px;color:var(--green-dark);font-weight:700;margin-top:10px}
  .tut-details ul{font-size:12.5px;line-height:1.6;padding-left:18px;margin:6px 0 0;color:var(--ink-soft)}
  .sw-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--border);color:#fff;
    padding:10px 16px;border-radius:10px;font-weight:700;z-index:60;box-shadow:3px 3px 0 var(--shadow)}
  .tour-panel{max-width:960px;margin:12px auto 0;padding:14px 16px;border-width:3px}
  .tour-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
  .tour-who{font-weight:800;color:#a24ab0}
  .tour-count{font-size:12.5px;color:var(--ink-soft);font-weight:700}
  .tour-dots{display:flex;gap:6px;margin:8px 0 2px}
  .tour-dot{width:10px;height:10px;border-radius:50%;border:2px solid var(--border);background:var(--surface)}
  .tour-dot.done{background:var(--green)}
  .tour-dot.now{background:var(--gold)}
  .tour-text{line-height:1.7;margin:8px 0 10px}
  .tour-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .tour-actions .btn{margin-top:0}
  .tour-lumi{pointer-events:none;transition:left 1.1s ease,top 1.1s ease;z-index:3}
  .tour-marker{position:absolute;transform:translate(-50%,-50%);font-size:clamp(18px,3vw,26px);pointer-events:none;
    animation:markbob 1s ease-in-out infinite;z-index:3}
  @keyframes markbob{0%,100%{margin-top:0}50%{margin-top:-6px}}
  @media (prefers-reduced-motion: reduce){.tour-lumi{transition:none}.tour-marker{animation:none}}
  @media (max-width:520px){
    .plaza-sprite-icon,.plaza-player-icon{font-size:18px}
    .plaza-npc-icon{padding:3px}
    .plaza-sprite-label{font-size:9px;padding:0 3px}
    .plaza-player-icon svg{width:30px;height:30px}
    .plaza-deco{font-size:16px}
  }

  /* ================= 이음 마을 스타일 (3D 컨셉 아티팩트 톤, 2026-09-29) ================= */
  :root{
    --bg:#EBD7AE; --surface:#FFF8EC; --surface-2:#F6EBD6; --ink:#2F3642; --ink-soft:#5A4A3C;
    --green-dark:#2F6E69; --green:#2F6E69; --green-light:#CFE3DF; --blue:#3F8C86; --blue-soft:#E3F0EE;
    --gold:#E9B44C; --gold-soft:#F7ECD3; --pink:#B5475B; --border:#E7D3B4; --shadow:rgba(122,75,46,.18);
    color-scheme: light;
  }
  body{font-family:'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-tap-highlight-color:transparent}
  .pixel-panel{border:0;border-radius:26px;box-shadow:0 8px 0 rgba(122,75,46,.2);background:var(--surface)}
  .btn{border:0;border-radius:999px;box-shadow:0 4px 0 rgba(122,75,46,.18);min-height:44px;background:#F1E2C8;color:var(--ink);font-weight:700}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(122,75,46,.18)}
  .btn-primary{background:var(--ink);color:var(--surface)}
  .btn-option{background:#2F6E69;color:#FFF8EC}
  .btn-ghost{color:#2F6E69}
  .login-card h1,.onboarding-card h1,.survey-q{font-family:'Gowun Batang','Gowun Dodum',serif;font-weight:700;color:var(--ink)}
  .login-card h1{font-size:28px}
  .survey-progress{border:0;background:#EFE1C6;height:8px;border-radius:999px}
  .survey-progress>span{background:#2F6E69}
  .choice,.vibe{border:0;border-radius:18px;background:#F6EBD6;box-shadow:0 4px 0 rgba(122,75,46,.14);min-height:48px}
  .choice.on,.vibe.on{background:#2F6E69;color:#FFF8EC}
  .chip{border:0;background:#F1E2C8;min-height:40px}
  .chip[aria-pressed="true"]{background:#2F6E69;color:#FFF8EC}
  .swatch{border:3px solid #FFF8EC;box-shadow:0 0 0 2px #E7D3B4}
  .swatch.on{outline:3px solid #2F3642}
  .survey-input{border:2px solid #E7D3B4;border-radius:14px;background:#FFFDF7}
  .char-preview{background:linear-gradient(#F7E4C0,#F1D6A8);border:0;border-radius:22px;min-height:230px;align-items:center}
  .char-preview canvas{display:block}
  .part-row button{border:0;border-radius:12px;background:#F1E2C8}
  .dot{border:2px solid #FFF8EC;box-shadow:0 0 0 1px #C9B28E}
  .topbar{border-bottom:2px solid var(--border)}
  .mission-item,.club-item{border-radius:22px}
  #banner{border:0;border-radius:18px;background:#FFF8EC;box-shadow:0 5px 0 rgba(122,75,46,.14)}

  /* 대화창 — 화면 아래 말풍선(아티팩트 .dialog) */
  .modal-backdrop{background:linear-gradient(rgba(47,54,66,0) 45%,rgba(47,54,66,.28));align-items:flex-end;
    padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
  .npc-modal{max-width:560px;border:0 !important;border-radius:26px;padding:20px 22px 18px;box-shadow:0 8px 0 rgba(122,75,46,.22)}
  .npc-modal-emoji{border:0;font-size:18px}
  .npc-modal-text{background:transparent;padding:0;font-size:18px;line-height:1.6;margin:4px 0 10px;text-wrap:pretty}
  .npc-modal-options{flex-direction:row;flex-wrap:wrap;justify-content:flex-end;gap:8px}
  .npc-modal-options .btn{width:auto;margin-top:0;box-shadow:none}
  .npc-modal-options .btn-option{background:#F1E2C8;color:var(--ink)}
  .npc-modal-options .btn-option:last-child,.npc-modal-options .btn-primary{background:var(--ink);color:#FFF8EC}
  .crisis-box{border-radius:16px}

  /* 3D 무대와 HUD */
  #stage{position:fixed;inset:0;touch-action:none;z-index:0}
  #stage canvas{display:block;width:100%;height:100%;outline:none}
  body.in-world{overflow:hidden;background:#EBD7AE}
  body.in-world #banner, body.in-world #app{display:none}
  body:not(.in-world) .world-ui{display:none !important}
  #hud-minimap{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:16px;z-index:2;width:150px;height:150px;border-radius:50%;

<script>
/*
 * 3D 마을 엔진 — 이음 마을 3D 컨셉(아티팩트)을 소셜 월드에 옮긴 것
 *   둥근 지평선·바람에 흔들리는 풀·틸트시프트 후처리는 원본 그대로.
 *   새 맵(광장·지원센터·미션방·동아리센터·게임방·카페·공원·내 집)과 내 방 실내.
 *   게임 규칙(튜토리얼·투어·대화)은 app.js, 휴대폰·지도는 ui.js. 엔진은 장면·이동·근처 판정만 맡는다.
 *
 * UI 시연본(PR #13, social-world-ui-v2)에서 가져온 추가 기능: 키 바꾸기(setBindings), 입력 정지(pauseInput),
 * 화질 선택(setQuality), 전체 지도 바탕(mapBase), NPC 위치(npcPositions), 미니맵 북쪽 고정, 순간이동 때 강아지 동행.
 */
  var ENGINE = null, ENGINE_FAILED = false;
  function getEngine(){
    if(ENGINE || ENGINE_FAILED) return ENGINE;
    if(!window.THREE){ ENGINE_FAILED = true; return null; }
    try { ENGINE = makeEngine(); } catch(e){ console.warn("3D 엔진 초기화 실패:", e); ENGINE_FAILED = true; ENGINE = null; }
    return ENGINE;
  }

  function makeEngine(){
    const THREE = window.THREE;
    const LITE = !!window.__SW_LITE;
    const reduceMotion = !!(window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
    const isSmall = Math.min(window.innerWidth, window.innerHeight) < 600;
    THREE.ColorManagement.legacyMode = false;
    const stage = document.getElementById('stage');
    const renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: 'high-performance' });
    const isGL2 = renderer.capabilities.isWebGL2;
    let DPR = 1;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;
    stage.appendChild(renderer.domElement);
    renderer.domElement.setAttribute('tabindex', '0');

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(new THREE.Color('#A6D4F2').convertSRGBToLinear(), 110, 300);   // 맑은 날: 먼 곳만 옅은 하늘색
    const camera = new THREE.PerspectiveCamera(34, 1, 0.5, 400);

    // ---------------- 공통: 둥근 지평선 + 바람 (원본 그대로)
    const U = { center: { value: new THREE.Vector3() }, k: { value: 0.0045 }, time: { value: 0 }, yaw: { value: 0 } };
    const BEND_K = 0.0045;
    function bendY(x, z) { const dz = z - U.center.value.z, dx = x - U.center.value.x, c = Math.cos(U.yaw.value), s = Math.sin(U.yaw.value), a = dx * s + dz * c, b = dx * c - dz * s; return U.k.value * (a * a + 0.25 * b * b); }   // 카메라가 보는 방향으로 더 휘어진다
    function patch(mat, wind = 0) {
      mat.onBeforeCompile = (sh) => {
        sh.uniforms.uBendCenter = U.center; sh.uniforms.uBendK = U.k; sh.uniforms.uTime = U.time; sh.uniforms.uYaw = U.yaw;
        const sway = wind ? `
            float sw = ${wind.toFixed(4)} * max(0.0, transformed.y);
            bw.x += sin(uTime * 1.6 + bw.x * 0.45 + bw.z * 0.3) * sw;
            bw.z += cos(uTime * 1.2 + bw.x * 0.25) * sw * 0.5;` : '';
        sh.vertexShader = 'uniform vec3 uBendCenter;\nuniform float uBendK;\nuniform float uTime;\nuniform float uYaw;\n' + sh.vertexShader
          .replace('#include <project_vertex>', `
            vec4 bw = vec4( transformed, 1.0 );
            #ifdef USE_INSTANCING
              bw = instanceMatrix * bw;
            #endif
            bw = modelMatrix * bw;${sway}
            float bdz = bw.z - uBendCenter.z; float bdx = bw.x - uBendCenter.x;
            float bya = bdx * sin(uYaw) + bdz * cos(uYaw); float byb = bdx * cos(uYaw) - bdz * sin(uYaw);
            bw.y -= uBendK * (bya * bya + 0.25 * byb * byb);
            vec4 mvPosition = viewMatrix * bw;
            gl_Position = projectionMatrix * mvPosition;`)
          .replace('#include <worldpos_vertex>', `
            #include <worldpos_vertex>
            #if defined( USE_SHADOWMAP ) || defined( USE_ENVMAP ) || defined( DISTANCE ) || defined ( USE_TRANSMISSION )
              { float wdz = worldPosition.z - uBendCenter.z; float wdx = worldPosition.x - uBendCenter.x;
                float wya = wdx * sin(uYaw) + wdz * cos(uYaw); float wyb = wdx * cos(uYaw) - wdz * sin(uYaw);
                worldPosition.y -= uBendK * (wya * wya + 0.25 * wyb * wyb); }
            #endif`);
      };
      mat.customProgramCacheKey = () => 'bend2_' + wind;
      return mat;
    }
    const depthMat = patch(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking }));
    const matCache = new Map();
    function M(color, o = {}) {
      const key = color + JSON.stringify(o, (k, v) => (v && v.isTexture ? v.uuid : v));
      if (matCache.has(key)) return matCache.get(key);
      const m = patch(new THREE.MeshStandardMaterial({
        color, roughness: o.r ?? 0.85, metalness: 0, flatShading: !!o.flat,
        emissive: o.em || '#000000', emissiveIntensity: o.ei ?? 0,
        transparent: !!o.transparent, opacity: o.opacity ?? 1, map: o.map || null, vertexColors: !!o.vc,
        alphaTest: o.alphaTest || 0, side: o.double ? THREE.DoubleSide : THREE.FrontSide
      }), o.wind || 0);
      matCache.set(key, m); return m;
    }
    function shade(obj, cast = true, receive = true) {
      obj.traverse(c => { if (c.isMesh) { c.castShadow = cast; c.receiveShadow = receive; if (cast) c.customDepthMaterial = c.userData.depth || depthMat; } });
      return obj;
    }
    function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene) { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); parent.add(m); return m; }
    const rnd = (() => { let s = 20260928; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();

    function roundedRect(w, h, r) {
      const s = new THREE.Shape(), x = -w / 2, y = -h / 2; r = Math.min(r, w / 2, h / 2);
      s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
      s.lineTo(x + w, y + h - r); s.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
      s.lineTo(x + r, y + h); s.quadraticCurveTo(x, y + h, x, y + h - r); s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y);
      return s;
    }
    const geoCache = new Map();
    function rbox(w, h, d, b = 0.12) {
      const key = [w, h, d, b].join(','); if (geoCache.has(key)) return geoCache.get(key);
      b = Math.min(b, w / 3, h / 3, d / 3);
      const g = new THREE.ExtrudeGeometry(roundedRect(w - 2 * b, h - 2 * b, b), { depth: Math.max(0.001, d - 2 * b), bevelEnabled: true, bevelSize: b, bevelThickness: b, bevelSegments: 3, curveSegments: 5 });
      g.center(); geoCache.set(key, g); return g;
    }
    function prism(w, h, d, b = 0.08) {
      const s = new THREE.Shape(); s.moveTo(-w / 2, 0); s.lineTo(w / 2, 0); s.lineTo(0, h); s.lineTo(-w / 2, 0);
      const g = new THREE.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelSize: b, bevelThickness: b, bevelSegments: 2, curveSegments: 2 });
      g.translate(0, 0, -d / 2); return g;
    }
    // 직사각형 모임지붕 — 네 면이 모두 경사지고 용마루는 긴 변 방향. W·D는 처마까지 포함한 바닥 크기, 아래에 처마 두께판
    function hipRoof(parent, y, W, D, H, mat, T = 0.22) {
      const g = new THREE.Group(); g.position.y = y; parent.add(g);
      mesh(rbox(W, T, D, 0.08), mat, 0, T / 2, 0, g);
      const r = Math.max(0, (W - D) / 2), w = W / 2, d = D / 2, y0 = T * 0.9;
      const A = [-w, y0, -d], B = [w, y0, -d], C = [w, y0, d], E = [-w, y0, d], R1 = [-r, y0 + H, 0], R2 = [r, y0 + H, 0];
      const faces = [[[E, C, R2], [E, R2, R1]], [[B, A, R1], [B, R1, R2]], [[C, B, R2]], [[A, E, R1]]];
      const pos = [], uv = [];
      faces.forEach((f, i) => f.forEach(t => t.forEach(p => { pos.push(p[0], p[1], p[2]); if (i < 2) uv.push(p[0], p[2]); else uv.push(p[2], p[0]); })));
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      geo.computeVertexNormals();
      mesh(geo, mat, 0, 0, 0, g);
      return g;
    }
    function canvasTex(w, h, draw, srgb = true) {
      const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
      const t = new THREE.CanvasTexture(c); if (srgb) t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; return t;
    }
    const FONT = "'Gowun Dodum','Apple SD Gothic Neo','Malgun Gothic',sans-serif";
    const COL = {
      wall: '#F6E9D3', wallWarm: '#F3DFC0', roof: '#D9774F', teal: '#3F8C86', tealDark: '#2F6E69',
      wood: '#B7835A', woodDark: '#86603F', ink: '#2F3642', gold: '#E9B44C', glass: '#9CC7D0', lit: '#F7D48E', water: '#6FB9BF'
    };

    // ---------------- 잎 카드
    const leafTex = canvasTex(128, 128, (g, w, h) => {
      g.clearRect(0, 0, w, h);
      const grd = g.createLinearGradient(0, h, w, 0); grd.addColorStop(0, '#D9D9D9'); grd.addColorStop(1, '#FFFFFF');
      g.fillStyle = grd; g.beginPath(); g.moveTo(w * 0.5, h * 0.04);
      g.bezierCurveTo(w * 0.98, h * 0.3, w * 0.9, h * 0.8, w * 0.5, h * 0.97);
      g.bezierCurveTo(w * 0.1, h * 0.8, w * 0.02, h * 0.3, w * 0.5, h * 0.04); g.fill();
      g.strokeStyle = 'rgba(140,140,140,.55)'; g.lineWidth = 4; g.beginPath(); g.moveTo(w * 0.5, h * 0.12); g.lineTo(w * 0.5, h * 0.92); g.stroke();
    });
    const foliageDepth = patch(new THREE.MeshDepthMaterial({ depthPacking: THREE.RGBADepthPacking, map: leafTex, alphaTest: 0.5 }), 0.02);
    function foliageMat(wind = 0.02) { return M('#FFFFFF', { map: leafTex, alphaTest: 0.5, vc: true, double: true, wind, r: 0.9 }); }
    function foliage(clusters) {
      const pos = [], nor = [], uv = [], col = [], idx = [];
      const e = new THREE.Euler(), q = new THREE.Quaternion(), ux = new THREE.Vector3(), uy = new THREE.Vector3(), d = new THREE.Vector3(), c = new THREE.Color(), n = new THREE.Vector3(), up = new THREE.Vector3(0, 0.35, 0);
      for (const cl of clusters) {
        const pal = cl.pal.map(hx => new THREE.Color(hx));
        for (let i = 0; i < cl.n; i++) {
          d.set(rnd() * 2 - 1, rnd() * 1.6 - 0.45, rnd() * 2 - 1).normalize();
          const rr = cl.r * (0.62 + rnd() * 0.42);
          const cx = cl.x + d.x * rr, cy = cl.y + d.y * rr * (cl.flat || 0.85), cz = cl.z + d.z * rr;
          e.set(rnd() * 6.28, rnd() * 6.28, rnd() * 6.28); q.setFromEuler(e);
          const s = cl.size * (0.75 + rnd() * 0.5);
          ux.set(s * 0.5, 0, 0).applyQuaternion(q); uy.set(0, s * 0.62, 0).applyQuaternion(q);
          n.copy(d).add(up).normalize();
          const t = THREE.MathUtils.clamp(d.y * 0.6 + 0.45 + (rnd() - 0.5) * 0.35, 0, 1);
          if (t < 0.5) c.copy(pal[0]).lerp(pal[1], t * 2); else c.copy(pal[1]).lerp(pal[2], (t - 0.5) * 2);
          const b = pos.length / 3;
          for (const [a, bb, u, v] of [[-1, -1, 0, 0], [1, -1, 1, 0], [1, 1, 1, 1], [-1, 1, 0, 1]]) {
            pos.push(cx + ux.x * a + uy.x * bb, cy + ux.y * a + uy.y * bb, cz + ux.z * a + uy.z * bb);
            nor.push(n.x, n.y, n.z); uv.push(u, v); col.push(c.r, c.g, c.b);
          }
          idx.push(b, b + 1, b + 2, b, b + 2, b + 3);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
      g.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
      g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setIndex(idx); g.computeBoundingSphere();

        if (Math.hypot(x - R, y - R) < R - 15) { g.strokeStyle = '#FFF8E8'; g.lineWidth = 3; g.strokeText(p.name, x, y); g.fillStyle = '#365B4C'; g.fillText(p.name, x, y); }
      }
      g.save(); g.translate(R, R); g.rotate(yaw - player.rotation.y); g.beginPath(); g.moveTo(0, 8); g.lineTo(-5, -5); g.lineTo(5, -5); g.closePath(); g.fillStyle = '#F26D58'; g.fill(); g.strokeStyle = '#FFFFFF'; g.lineWidth = 1.5; g.stroke(); g.restore();
      g.fillStyle = '#BA574B'; g.fillText('N', R + Math.sin(yaw) * (R - 10), R - Math.cos(yaw) * (R - 10));
      g.beginPath(); g.arc(R, R, R - 2, 0, Math.PI * 2); g.strokeStyle = '#FFF8E8'; g.lineWidth = 3; g.stroke();
    }
    return {
      tick, mapBase, drawMinimap, finish, cancel, collide: collideBus,
      drawVillageMap(g, P, scale) {
        const r = data.villageRoad, [x, z] = P(r.x - r.width / 2, r.z0);
        g.fillStyle = '#7D8B89'; g.fillRect(x, z, r.width * scale, (r.z1 - r.z0) * scale);
        g.strokeStyle = '#FFF1B5'; g.lineWidth = Math.max(1, .12 * scale); g.setLineDash([1.7 * scale, 2.3 * scale]);
        g.beginPath(); g.moveTo(...P(r.x, r.z0)); g.lineTo(...P(r.x, r.z1)); g.stroke(); g.setLineDash([]);
        g.strokeStyle = '#EADFC4'; g.lineWidth = data.villagePath.width * scale;
        g.beginPath(); g.moveTo(...P(data.villagePath.from.x, data.villagePath.from.z)); g.lineTo(...P(data.villagePath.to.x, data.villagePath.to.z)); g.stroke();
        const platform = P(45.25, 10.7); g.fillStyle = '#E4D8BE'; g.fillRect(...platform, 3.8 * scale, 8.8 * scale);
      },
      enter(mode) {
        if (ride && !(ride.transferred && mode === ride.destination)) cancel();
        plaza.visible = mode === 'market'; stop.visible = mode === 'village';
        for (const kind of Object.keys(interiors)) interiors[kind].visible = kind === mode;
      },
      start(destination, cb) {
        if (ride || !['village', 'market'].includes(engine.mode()) || destination === engine.mode()) return false;
        engine.pauseInput(); const p = getPlayer();
        ride = { source: engine.mode(), destination, origin: { x: p.position.x, z: p.position.z }, cb, transferred: false };
        bus.visible = true; setBus(ride.source, 25); phase('approach'); return true;
      },
      info: () => ride ? { phase: ride.phase, source: ride.source, destination: ride.destination, transferred: ride.transferred } : null,
      roomBounds(mode) { const p = data.rooms[mode]; return p ? { x0: p.x - 4.5, x1: p.x + 4.5, z0: p.z - 4.4, z1: p.z + 4.3 } : null; },
      debug: () => ({ marketVisible: plaza.visible, interiors: Object.fromEntries(Object.entries(interiors).map(([k, g]) => [k, g.visible])), busVisible: bus.visible, playerVisible: getPlayer()?.visible,
        clock: bankClock ? { ...bankClock.time, hourAngle: bankClock.hour.rotation.z, minuteAngle: bankClock.minute.rotation.z, hands3D: bankClock.hour.children[0].geometry.type === 'ExtrudeGeometry' && bankClock.minute.children[0].geometry.type === 'ExtrudeGeometry' } : null,
        benches: benches.map(g => ({ id: g.name, area: g.userData.area, x: g.position.x + g.parent.position.x, z: g.position.z + g.parent.position.z, angle: g.rotation.y, seats: g.userData.seats })),
        bus: { x: bus.position.x, z: bus.position.z, angle: bus.rotation.y, halfLength: 3.86, halfWidth: 1.63, colliderActive: bus.visible && bus.userData.area === engine.mode(), doorOpen: busDoor.position.x > -1.7 },
        walkingPath: ride?.path?.map(p => ({ ...p })) || null, signs: stopSigns.map(p => ({ ...p })), signFonts: signFonts.map(p => ({ ...p })) })
    };
  };
})(window);

</script>

<script>
/*
 * 코코 v1 — 활동 추천 NPC 화면 모듈
 *
 * 쓰는 법 (socialworld-demo.html 등):
 *   <script src="coco/coco.js"><\/script>
 *   Coco.open({
 *     sb,                              // 이미 로그인된 supabase 클라이언트
 *     onOpenClub: (clubId) => { ... }, // "동아리 보러 가기"를 눌렀을 때 (동아리센터 화면 열기)
 *     onClose: () => { ... },          // 창을 닫았을 때 (선택)
 *     logDemand: async (row) => {...}  // 수요 기록 방식을 바꾸고 싶을 때 (선택, 아래 참고)
 *   })
 *
 * - 추천 계산은 DB 함수 recommend_activities()가 한다. 여기서는 모드와 개수만 보낸다.
 * - LLM을 쓰지 않는다. 자유 입력창이 없다(위기 발화가 들어올 통로가 없음).
 * - 월드 밖 활동은 게임이 대신 신청하지 않는다. 링크를 새 탭으로 열고, 유저가 "신청했어요"로 알린다.
 *
 * 수요 기록은 03_world_update.sql의 npc_demand_logs(npc_type, category, item_id, action)에 남긴다.
 * 기록이 실패해도 화면은 멈추지 않는다(콘솔 경고만).
 */
(function (global) {
  'use strict';

  var MODES = [
    { key: 'interest', label: '내 관심사로 찾아줘' },
    { key: 'today',    label: '오늘 해볼 만한 거 있어?' },
    { key: 'nearby',   label: '우리 동네 모임 알려줘' }
  ];

  var LINES = {
    hello:     '안녕! 나는 코코야. 같이 해볼 만한 모임이나 활동을 찾아줄게.',
    loading:   '잠깐만, 찾아보는 중이야…',
    result: {
      interest: '네 관심사에 맞춰 골라봤어.',
      today:    '오늘 해볼 만한 걸 골라봤어.',
      nearby:   '우리 동네에서 열리는 모임이야.'
    },
    empty:     '지금 딱 맞는 게 없네. 다른 방법으로 찾아볼까?',
    needProfile: '처음 설문을 마치면 네 관심사에 맞춰 추천해 줄 수 있어.',
    needLogin: '먼저 마을에 들어와야 추천해 줄 수 있어.',
    failed:    '지금은 목록을 못 불러왔어. 조금 뒤에 다시 물어봐 줘.',
    applied:   '멋지다! 퀘스트에 기록해 둘게.',
    opened:    '신청은 새 창에서 직접 해줘. 마치면 "신청했어요"를 눌러 줘.'
  };

  var STYLE_ID = 'coco-style';
  var CSS = [
    '.coco-backdrop{position:fixed;inset:0;background:rgba(20,32,26,.38);display:flex;align-items:flex-end;justify-content:center;z-index:9000}',
    '@media (min-width:600px){.coco-backdrop{align-items:center}}',
    '.coco-panel{--coco-leaf:#2E6B4F;--coco-leaf-soft:#E3F0E8;--coco-sun:#F4B942;--coco-sun-soft:#FDF1D6;--coco-sky:#3E7CB1;--coco-sky-soft:#E4EEF7;--coco-ink:#1F2A24;--coco-muted:#5C6B63;--coco-line:#D6E1DA;',
    '  width:100%;max-width:440px;max-height:88vh;overflow:auto;background:#FBFCFB;color:var(--coco-ink);border-radius:18px 18px 0 0;padding:20px 18px 22px;font:inherit;line-height:1.55;box-sizing:border-box}',
    '@media (min-width:600px){.coco-panel{border-radius:18px}}',
    '.coco-head{display:flex;gap:12px;align-items:flex-start}',
    '.coco-face{flex:0 0 48px;height:48px;border-radius:50%;background:var(--coco-leaf);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px}',
    '.coco-bubble{position:relative;background:var(--coco-leaf-soft);border-radius:14px;padding:10px 14px;font-size:15px;flex:1}',
    '.coco-bubble:before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-right-color:var(--coco-leaf-soft);border-left:0}',
    '.coco-name{font-size:13px;color:var(--coco-muted);margin:0 0 2px}',
    '.coco-close{margin-left:auto;background:none;border:0;font-size:22px;line-height:1;color:var(--coco-muted);cursor:pointer;padding:4px 6px;border-radius:8px}',
    '.coco-choices{display:flex;flex-direction:column;gap:8px;margin-top:16px}',
    '.coco-btn{font:inherit;font-size:15px;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid var(--coco-line);background:#fff;color:var(--coco-ink);cursor:pointer}',
    '.coco-btn:hover{border-color:var(--coco-leaf)}',
    '.coco-btn:focus-visible,.coco-close:focus-visible,.coco-act:focus-visible{outline:3px solid var(--coco-sun);outline-offset:2px}',
    '.coco-list{list-style:none;margin:16px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}',
    '.coco-item{border:1px solid var(--coco-line);border-left:6px solid var(--coco-leaf);border-radius:4px 12px 12px 4px;background:#fff;padding:12px 14px}',
    '.coco-item[data-where="town"]{border-left-color:var(--coco-sun)}',
    '.coco-item[data-where="online"]{border-left-color:var(--coco-sky)}',
    '.coco-where{font-size:12px;color:var(--coco-muted);margin:0}',
    '.coco-title{font-size:16px;font-weight:600;margin:2px 0 4px}',
    '.coco-summary{font-size:14px;margin:0;color:var(--coco-ink)}',
    '.coco-when{font-size:13px;color:var(--coco-muted);margin:6px 0 0}',
    '.coco-reason{font-size:13px;margin:8px 0 0;padding:6px 10px;background:var(--coco-sun-soft);border-radius:8px}',
    '.coco-demo{font-size:12px;color:var(--coco-muted);margin:6px 0 0}',
    '.coco-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}',
    '.coco-act{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:0;background:var(--coco-leaf);color:#fff;cursor:pointer}',
    '.coco-act.secondary{background:#fff;color:var(--coco-leaf);border:1.5px solid var(--coco-leaf)}',
    '.coco-act[disabled]{background:var(--coco-line);color:var(--coco-muted);cursor:default;border-color:transparent}',
    '.coco-foot{display:flex;gap:8px;margin-top:16px}',
    '.coco-foot .coco-btn{flex:1;text-align:center;font-size:14px;padding:10px}',
    '.coco-status{min-height:1px}',
    '@media (prefers-reduced-motion:no-preference){.coco-panel{animation:coco-up .18s ease-out}@keyframes coco-up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}}'
  ].join('\n');

  function injectStyle() {
    if (document.getElementById(STYLE_ID)) return;
    var s = document.createElement('style');
    s.id = STYLE_ID;
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  // 수요 기록 기본값 — 03_world_update.sql의 npc_demand_logs 칸 이름 기준
  async function defaultLogDemand(sb, row) {
    try {
      var res = await sb.from('npc_demand_logs').insert({
        npc_type: 'coco',
        action: row.action,        // recommend | apply_click | self_reported
        category: row.category,    // 관심사 태그 또는 'club'/'activity'
        item_id: row.itemKey       // 'club:12' / 'activity:5'
      });
      if (res && res.error) console.warn('[coco] 수요 기록 실패', res.error.message);
    } catch (e) {
      console.warn('[coco] 수요 기록 실패', e);
    }
  }

  function errorLine(err) {
    var msg = (err && (err.message || err.details)) || '';
    if (msg.indexOf('profile_required') >= 0) return LINES.needProfile;
    if (msg.indexOf('login_required') >= 0) return LINES.needLogin;
    return LINES.failed;
  }

  function whereOf(item) {
    if (item.kind === 'club') return { key: 'club', label: '월드 동아리' };
    if (item.is_online) return { key: 'online', label: '온라인' };
    return { key: 'town', label: '우리 동네' };
  }

  function open(opts) {
    opts = opts || {};
    var sb = opts.sb;
    if (!sb) throw new Error('Coco.open: sb(supabase 클라이언트)가 필요합니다');
    var log = opts.logDemand || function (row) { return defaultLogDemand(sb, row); };
    injectStyle();

    var lastFocus = document.activeElement;
    var bubbleText = el('p', { style: 'margin:0', 'aria-live': 'polite' });
    var body = el('div', { class: 'coco-status' });
    var closeBtn = el('button', { class: 'coco-close', type: 'button', 'aria-label': '코코와 대화 닫기', text: '×', onclick: close });
    var panel = el('div', { class: 'coco-panel', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'coco-dialog-name' }, [
      el('div', { class: 'coco-head' }, [
        el('div', { class: 'coco-face', 'aria-hidden': 'true', text: '코코' }),
        el('div', { class: 'coco-bubble' }, [
          el('p', { class: 'coco-name', id: 'coco-dialog-name', text: '코코 · 활동 추천' }),
          bubbleText
        ]),
        closeBtn
      ]),
      body
    ]);
    var backdrop = el('div', { class: 'coco-backdrop', onclick: function (e) { if (e.target === backdrop) close(); } }, [panel]);

    function onKey(e) {
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Tab') return;
      var f = panel.querySelectorAll('button:not([disabled])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }

    function close() {
      document.removeEventListener('keydown', onKey, true);
      if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
      if (opts.onClose) opts.onClose();
    }

    function say(text) { bubbleText.textContent = text; }
    function setBody(nodes) {
      body.innerHTML = '';
      nodes.forEach(function (n) { body.appendChild(n); });
      var first = body.querySelector('button:not([disabled])');
      if (first) first.focus();
    }

    function showChoices() {
      say(LINES.hello);
      setBody([el('div', { class: 'coco-choices' }, MODES.map(function (m) {
        return el('button', { class: 'coco-btn', type: 'button', text: m.label, onclick: function () { load(m.key); } });
      }))]);
    }

    function footer(mode) {
      var nodes = [el('button', { class: 'coco-btn', type: 'button', text: '다른 방법으로 찾기', onclick: showChoices })];
      if (mode) nodes.push(el('button', { class: 'coco-btn', type: 'button', text: '다시 찾아보기', onclick: function () { load(mode); } }));
      return el('div', { class: 'coco-foot' }, nodes);
    }

    async function load(mode) {
      say(LINES.loading);
      setBody([]);
      var res;
      try {
        res = await sb.rpc('recommend_activities', { p_mode: mode, p_limit: 3 });
      } catch (e) {
        res = { error: e };
      }
      if (res.error) {
        say(errorLine(res.error));
        setBody([footer(mode)]);
        return;
      }
      var items = res.data || [];
      if (!items.length) {
        say(LINES.empty);
        setBody([footer(null)]);
        return;
      }
      say(LINES.result[mode]);
      setBody([el('ul', { class: 'coco-list' }, items.map(card)), footer(null)]);
      items.forEach(function (it) { log({ action: 'recommend', itemKey: it.item_key, category: it.kind }); });
    }

    function card(item) {
      var w = whereOf(item);
      var actions = el('div', { class: 'coco-actions' });

      if (item.kind === 'club') {
        var clubId = Number(String(item.item_key).split(':')[1]);
        actions.appendChild(el('button', {
          class: 'coco-act', type: 'button', text: '동아리 보러 가기',
          onclick: function () {
            log({ action: 'apply_click', itemKey: item.item_key, category: 'club' });
            close();
            if (opts.onOpenClub) opts.onOpenClub(clubId);
          }
        }));
      } else if (item.apply_url) {
        var doneBtn = el('button', {
          class: 'coco-act secondary', type: 'button', text: '신청했어요', disabled: true,
          onclick: function () {
            log({ action: 'self_reported', itemKey: item.item_key, category: 'activity' });
            doneBtn.textContent = '신청 완료로 기록했어요';
            doneBtn.disabled = true;
            say(LINES.applied);
          }
        });
        actions.appendChild(el('button', {
          class: 'coco-act', type: 'button', text: '신청 페이지 열기',
          onclick: function () {
            log({ action: 'apply_click', itemKey: item.item_key, category: 'activity' });
            window.open(item.apply_url, '_blank', 'noopener,noreferrer');
            doneBtn.disabled = false;
            say(LINES.opened);
          }
        }));
        actions.appendChild(doneBtn);
      }

      var place = item.place_label === w.label ? null : item.place_label; // '온라인, 온라인' 중복 방지
      var when = [place, item.time_label].filter(Boolean).join(', ');
      return el('li', { class: 'coco-item', 'data-where': w.key }, [
        el('p', { class: 'coco-where', text: w.label }),
        el('p', { class: 'coco-title', text: item.title }),
        item.summary ? el('p', { class: 'coco-summary', text: item.summary }) : null,
        when ? el('p', { class: 'coco-when', text: when }) : null,
        el('p', { class: 'coco-reason', text: '코코: ' + item.reason }),
        item.is_demo ? el('p', { class: 'coco-demo', text: '시연용 예시 활동이라 신청 링크가 없어요.' }) : null,
        actions.childNodes.length ? actions : null
      ]);
    }

    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(backdrop);
    showChoices();
    return { close: close };
  }

  global.Coco = { open: open, _lines: LINES };
})(window);

</script>

<script>
/*
 * 마을이장 v1 — 광장 이벤트 안내 화면 모듈
 *
 * 쓰는 법 (socialworld-demo.html 등):
 *   <script src="chief/chief.js"><\/script>
 *   Chief.open({
 *     sb,                         // 이미 로그인된 supabase 클라이언트
 *     nickname: "지수",           // 인사에 쓸 이름 (선택)
 *     onClose: () => { ... }      // 창을 닫았을 때 (선택) — 데모는 여기서 튜토리얼 첫 퀘스트를 완료한다
 *   })
 *
 * - 이벤트는 risk_agent/chief.py가 규칙으로 정하고, 담당자가 승인한 것(published)만 world_events_public 뷰로 보인다.
 * - 뷰에는 "왜 이 이벤트가 열렸는지"(대상 코호트·근거)가 없다. 내 코호트 대상(featured)은 위로 정렬만 한다.
 * - 참여는 join_world_event(id) 함수로만 한다(초안·종료 이벤트 참여 차단은 DB가 한다).
 * - LLM·자유 입력 없음. 대사는 템플릿(v2에서 LLM 대사로 바꿀 자리: LINES).
 * - 03·05 적용 전이거나 이벤트가 없으면 인사와 안내만 하고 멈추지 않는다.
 * - [마을에 건의하기] — feedback/feedback.js가 있으면 마을 의견함 폼을 연다(07_feedback_chat.sql, 창구 'chief').
 *   이장은 전달만 한다. 답은 운영팀(사람)이 쓰고 시민 휴대폰 '내 의견함'에 온다.
 */
(function (global) {
  'use strict';

  var PLACE = {
    plaza: '광장', park: '공원', game_room: '게임방', cafe: '카페',
    club_center: '동아리센터', support_center: '지원센터', mission_room: '미션방'
  };
  var DAYS = ['일', '월', '화', '수', '목', '금', '토'];

  var LINES = {

  function injectStyle() {
    if (document.getElementById(STYLE_ID)) return;

    document.head.appendChild(s);
  }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(c); });
    return n;
  }

  function whenLabel(ev) {
    var d = new Date(ev.starts_at);
    if (isNaN(d)) return '';
    var hh = String(d.getHours()).padStart(2, '0'), mm = String(d.getMinutes()).padStart(2, '0');
    return (d.getMonth() + 1) + '월 ' + d.getDate() + '일(' + DAYS[d.getDay()] + ') ' + hh + ':' + mm;
  }

  async function fetchEvents(sb) {
    // featured(내 코호트에 먼저 보여줄 이벤트)는 정렬에만 쓴다. 화면에 "추천" 표시를 하지 않는다(대상 노출 방지)
    var res = await sb.from('world_events_public')
      .select('id,title,description,place,starts_at,ends_at,featured,joined')
      .order('featured', { ascending: false })
      .order('starts_at', { ascending: true })
      .limit(3);
    if (res && res.error) throw res.error;
    return (res && res.data) || [];
  }

  function open(opts) {
    opts = opts || {};
    var sb = opts.sb;
    if (!sb) throw new Error('Chief.open: sb(supabase 클라이언트)가 필요합니다');
    injectStyle();

    var lastFocus = document.activeElement;
    var bubbleText = el('p', { style: 'margin:0', 'aria-live': 'polite' });
    var body = el('div');
    var closeBtn = el('button', { class: 'chief-close', type: 'button', 'aria-label': '마을이장과 대화 닫기', text: '×', onclick: close });

      el('div', { class: 'chief-head' }, [
        el('div', { class: 'chief-face', 'aria-hidden': 'true', text: '🎩' }),
        el('div', { class: 'chief-bubble' }, [
          el('p', { class: 'chief-name', id: 'chief-dialog-name', text: '마을이장 · 광장' }),
          bubbleText
        ]),
        closeBtn
      ]),
      body
    ]);
    var backdrop = el('div', { class: 'chief-backdrop', onclick: function (e) { if (e.target === backdrop) close(); } }, [panel]);
    var closed = false;

    function onKey(e) {
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Tab') return;
      var f = panel.querySelectorAll('button:not([disabled])');
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }

    function close() {
      if (closed) return;
      closed = true;
      document.removeEventListener('keydown', onKey, true);
      if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
      if (opts.onClose) opts.onClose();
    }

    function say(text) { bubbleText.textContent = text; }
    function footer(back) {
      return el('div', { class: 'chief-foot' }, [
        back ? el('button', { class: 'chief-btn', type: 'button', text: '이번 주 모임 보기', onclick: load })
             : (global.Feedback ? el('button', { class: 'chief-btn', type: 'button', text: '마을에 건의하기', onclick: suggest }) : null),
        el('button', { class: 'chief-btn', type: 'button', text: '대화 마치기', onclick: close })
      ]);
    }
    function suggest() {
      say(LINES.suggest);
      setBody([global.Feedback.compose({ sb: sb, channel: 'chief', place: opts.place || '광장', onCancel: load }), footer(true)]);
      var first = body.querySelector('.fb-kind');
      if (first) first.focus();
    }
    function setBody(nodes) {
      body.innerHTML = '';
      nodes.forEach(function (n) { if (n) body.appendChild(n); });
      var first = body.querySelector('button:not([disabled])');
      if (first) first.focus();
    }

    function card(ev) {
      var place = PLACE[ev.place] || ev.place;
      var btn = el('button', {
        class: 'chief-act', type: 'button',
        text: ev.joined ? '참여 신청했어요 ✓' : '참여할래요',
        disabled: ev.joined ? 'disabled' : null,
        'aria-label': ev.joined ? null : ev.title + ' 참여하기',
        onclick: async function () {
          btn.disabled = true;
          var res;
          try { res = await sb.rpc('join_world_event', { p_event_id: ev.id }); } catch (e) { res = { error: e }; }
          if (res && res.error) {
            var msg = (res.error.message || '') + (res.error.details || '');
            if (msg.indexOf('event_not_open') >= 0) { say(LINES.closed); btn.textContent = '신청 마감'; return; }
            say(LINES.failed); btn.disabled = false; return;
          }
          btn.textContent = '참여 신청했어요 ✓';
          say(res && res.data === false ? LINES.already : LINES.joined(place));
          if (opts.onJoined) opts.onJoined(ev);
        }
      });
      return el('li', { class: 'chief-item' }, [
        el('p', { class: 'chief-when', text: place + ' · ' + whenLabel(ev) }),
        el('p', { class: 'chief-title', text: ev.title }),
        ev.description ? el('p', { class: 'chief-desc', text: ev.description }) : null,
        el('div', { class: 'chief-actions' }, [btn])
      ]);
    }

    async function load() {
      say(LINES.hello(opts.nickname) + ' ' + LINES.loading);
      var events;
      try {
        events = await fetchEvents(sb);
      } catch (e) {
        console.warn('[chief] 이벤트를 불러오지 못함(03·05 적용 전일 수 있음)', e && (e.message || e));
        say(LINES.hello(opts.nickname) + ' ' + LINES.empty);
        setBody([footer()]);
        return;
      }
      if (closed) return;
      if (!events.length) {
        say(LINES.hello(opts.nickname) + ' ' + LINES.empty);
        setBody([footer()]);
        return;
      }
      say(LINES.hello(opts.nickname) + ' ' + LINES.list);
      setBody([el('ul', { class: 'chief-list' }, events.map(card)), footer()]);
    }

    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(backdrop);
    setBody([footer()]);
    load();
    return { close: close };
  }

  global.Chief = { open: open, _lines: LINES };
})(window);

 *     onClose: () => { ... },           // 창을 닫았을 때 (선택)
 *     logDemand: async (row) => {...}   // 수요 기록 방식을 바꾸고 싶을 때 (선택)

 * - 신청은 시민이 직접 한다. 하루는 어디서 어떻게 하는지 알려 주고 복지로 링크를 새 탭으로 연다.
 *
 * 수요 기록(03 npc_demand_logs): npc_type = 일·취업 메뉴는 'job', 나머지는 'policy'. category = 메뉴 이름
 *   recommend  화면에 보인 카드마다          view          [자세히]를 열었을 때

    '.haru-title{font-size:16px;font-weight:600;margin:6px 0 2px;overflow-wrap:anywhere}',
    '.haru-org{font-size:12px;color:var(--h-muted);margin:0}',
    '.haru-summary{font-size:14px;margin:6px 0 0;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}',
    '.haru-reason{font-size:13px;margin:8px 0 0;padding:6px 10px;background:var(--h-teal-soft);border-radius:8px}',
    '.haru-age{font-size:13px;margin:6px 0 0;padding:6px 10px;background:var(--h-warn-soft);color:var(--h-warn);border-radius:8px}',
    '.haru-actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}',
    '.haru-act{font:inherit;font-size:14px;padding:8px 12px;border-radius:10px;border:0;background:var(--h-teal);color:#fff;cursor:pointer}',
    '.haru-act.secondary{background:#fff;color:var(--h-teal);border:1.5px solid var(--h-teal)}',
    '.haru-act[disabled]{background:var(--h-line);color:var(--h-muted);cursor:default;border-color:transparent}',
    '.haru-link{font:inherit;font-size:13px;background:none;border:0;padding:4px 2px;color:var(--h-muted);text-decoration:underline;cursor:pointer;margin-left:auto}',
    '.haru-detail{margin:10px 0 0;padding:10px 12px;background:#F4F8F8;border-radius:10px;font-size:14px}',
    '.haru-detail dt{font-weight:600;font-size:13px;color:var(--h-teal);margin-top:8px}',
    '.haru-detail dt:first-child{margin-top:0}',
    '.haru-detail dd{margin:2px 0 0;white-space:pre-line;overflow-wrap:anywhere}',
    '.haru-detail a{color:var(--h-teal)}',
    '.haru-checked{font-size:12px;color:var(--h-muted);margin:10px 0 0}',
    '.haru-more{width:100%;margin-top:10px}',
    '.haru-extra{margin-top:14px;display:flex;flex-direction:column;gap:6px}',
    '.haru-special-btn{text-align:left}',
    '.haru-muted{font-size:13px;color:var(--h-muted);margin:0}',
    '.haru-report{margin-top:10px;padding:10px 12px;border:1.5px solid var(--h-line);border-radius:10px;background:#fff}',
    '.haru-report label{display:block;font-size:13px;color:var(--h-muted);margin-bottom:6px}',
    '.haru-report textarea{width:100%;box-sizing:border-box;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--h-line);border-radius:8px;resize:vertical;min-height:72px}',
    '.haru-count{font-size:12px;color:var(--h-muted);text-align:right;margin:2px 0 6px}',
    '.haru-report-msg{font-size:13px;margin:8px 0 0}',
    '.haru-crisis{margin:10px 0 0;padding:12px 14px;border:3px solid #d64545;border-radius:12px;background:#fff5f5;color:#3a1515}',
    '.haru-crisis b{display:block;margin-bottom:4px}',
    '.haru-crisis p{margin:4px 0}',
    '.haru-crisis .num{font-size:20px;font-weight:800;color:var(--h-red);user-select:all;margin-left:6px}',
    '.haru-foot{display:flex;gap:8px;margin-top:16px}',
    '.haru-foot .haru-btn{flex:1}',
    '@media (prefers-reduced-motion:no-preference){.haru-panel{animation:haru-up .18s ease-out}@keyframes haru-up{from{transform:translateY(16px);opacity:0}to{transform:none;opacity:1}}}'
  ].join('\n');

  function injectStyle() {
    if (document.getElementById(STYLE_ID)) return;
    var s = document.createElement('style');
    s.id = STYLE_ID;
    s.textContent = CSS;
    document.head.appendChild(s);
  }

  function el(tag, attrs, children) {
    var n = document.createElement(tag);
    if (attrs) Object.keys(attrs).forEach(function (k) {
      if (k === 'text') n.textContent = attrs[k];
      else if (k === 'class') n.className = attrs[k];
      else if (k.slice(0, 2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
      else if (attrs[k] !== null && attrs[k] !== undefined && attrs[k] !== false) n.setAttribute(k, attrs[k]);
    });
    (children || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }

  // 소득 기준이 있는 사업은 어느 사업을 눌렀는지 남기지 않는다 — 메뉴 단위 수만 남김
  function itemIdOf(it) { return it.target_groups && it.target_groups.length ? null : it.serv_id; }

  function menuOf(key) { return MENUS.filter(function (m) { return m.key === key; })[0]; }

  // 수요 기록 기본값 — 03_world_update.sql의 npc_demand_logs 칸 이름 기준
  async function defaultLogDemand(sb, row) {
    try {
      var res = await sb.from('npc_demand_logs').insert({
        npc_type: row.menu === 'job' ? 'job' : 'policy',
        action: row.action,
        category: menuOf(row.menu).label,
        item_id: row.itemId || null
      });
      if (res && res.error) console.warn('[haru] 수요 기록 실패', res.error.message);
    } catch (e) {
      console.warn('[haru] 수요 기록 실패', e);
    }
  }

  function errorLine(err) {
    var msg = (err && (err.message || err.details)) || '';
    if (msg.indexOf('profile_required') >= 0) return LINES.needProfile;
    if (msg.indexOf('login_required') >= 0) return LINES.needLogin;
    return LINES.failed;
  }

  // 문의처 글에서 전화번호를 찾아 바로 걸기 링크로 만든다
  var PHONE = /(0\d{1,2}-\d{3,4}-\d{4}|1\d{3}-\d{4}|\b1\d{2}\b)/;
  function contactNode(text) {
    var m = text && text.match(PHONE);
    if (!m) return document.createTextNode(text || '');
    var i = text.indexOf(m[0]);
    return el('span', null, [text.slice(0, i), el('a', { href: 'tel:' + m[0].replace(/-/g, ''), text: m[0] }), text.slice(i + m[0].length)]);
  }

  function safeUrl(u) {
    return typeof u === 'string' && /^https?:\/\//i.test(u) ? u : null;
  }

  function crisisBox() {
    return el('div', { class: 'haru-crisis', role: 'alert' }, [
      el('b', { text: '지금 바로 이야기할 수 있는 곳' }),
      el('p', null, ['자살예방 상담전화', el('span', { class: 'num', text: '109' }), ' 24시간 · 무료']),
      el('p', null, ['정신건강 상담전화', el('span', { class: 'num', text: '1577-0199' })]),
      el('p', { text: '위급하면 112 또는 119에 바로 연락하세요. 카페 앞 루미에게 이야기해도 괜찮아요.' })
    ]);
  }

  function open(opts) {
    opts = opts || {};
    var sb = opts.sb;
    if (!sb) throw new Error('Haru.open: sb(supabase 클라이언트)가 필요합니다');
    var log = opts.logDemand || function (row) { return defaultLogDemand(sb, row); };
    var sgg = opts.profile && opts.profile.sgg_code;
    injectStyle();

    var lastFocus = document.activeElement;
    var bubbleText = el('p', { style: 'margin:0', 'aria-live': 'polite' });
    var body = el('div');
    var closeBtn = el('button', { class: 'haru-close', type: 'button', 'aria-label': '하루와 대화 닫기', text: '×', onclick: close });
    var panel = el('div', { class: 'haru-panel', role: 'dialog', 'aria-modal': 'true', 'aria-labelledby': 'haru-dialog-name' }, [
      el('div', { class: 'haru-head' }, [
        el('div', { class: 'haru-face', 'aria-hidden': 'true', text: '하루' }),
        el('div', { class: 'haru-bubble' }, [
          el('p', { class: 'haru-name', id: 'haru-dialog-name', text: '하루 · 지원센터 정책 안내' }),
          bubbleText
        ]),
        closeBtn
      ]),
      body
    ]);
    var backdrop = el('div', { class: 'haru-backdrop', onclick: function (e) { if (e.target === backdrop) close(); } }, [panel]);
    var closed = false;

    function focusables() { return panel.querySelectorAll('button:not([disabled]), a[href], textarea'); }
    function onKey(e) {
      if (e.key === 'Escape') { close(); return; }
      if (e.key !== 'Tab') return;
      var f = focusables();
      if (!f.length) return;
      var first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }

    function close() {
      if (closed) return;
      closed = true;
      document.removeEventListener('keydown', onKey, true);
      if (backdrop.parentNode) backdrop.parentNode.removeChild(backdrop);
      if (lastFocus && lastFocus.focus) lastFocus.focus();
      if (opts.onClose) opts.onClose();
    }

    function say(text) { bubbleText.textContent = text; }
    function setBody(nodes, focusSel) {
      body.innerHTML = '';
      nodes.forEach(function (n) { if (n) body.appendChild(n); });
      var first = body.querySelector(focusSel || 'button:not([disabled])');
      if (first) first.focus();
      panel.scrollTop = 0;
    }

    function showMenus() {
      say(LINES.hello);
      var nodes = [el('div', { class: 'haru-menus', role: 'group', 'aria-label': '궁금한 지원 고르기' }, MENUS.map(function (m) {
        return el('button', { class: 'haru-menu', type: 'button', 'data-menu': m.key, onclick: function () { load(m.key); } },
          [el('strong', { text: m.label }), el('small', { text: m.hint })]);
      }))];
      if (sgg && !REGIONS[sgg]) nodes.push(el('p', { class: 'haru-note', text: LINES.otherRegion }));
      setBody(nodes);
    }

    function footer() {
      return el('div', { class: 'haru-foot' }, [
        el('button', { class: 'haru-btn', type: 'button', text: '다른 지원 보기', onclick: showMenus }),
        el('button', { class: 'haru-btn', type: 'button', text: '대화 마치기', onclick: close })
      ]);
    }

    async function rpc(name, args) {
      try { return await sb.rpc(name, args); } catch (e) { return { error: e }; }
    }

    async function load(menu) {
      var m = menuOf(menu);
      say(LINES.loading);
      setBody([]);
      var both = await Promise.all([
        rpc('recommend_programs', { p_menu: menu, p_limit: MAX, p_special: false }),
        rpc('program_counts', { p_menu: menu })
      ]);
      if (closed) return;
      var res = both[0], cnt = both[1];
      if (res.error) { say(errorLine(res.error)); setBody([footer()]); return; }
      var items = res.data || [];
      var counts = (!cnt.error && cnt.data && cnt.data[0]) || { eligible: items.length, special: 0, ineligible: 0 };

      if (counts.ineligible > 0) log({ menu: menu, action: 'ineligible', itemId: 'count:' + counts.ineligible });

      var nodes = [];
      var list = el('ul', { class: 'haru-list', 'aria-label': m.label + ' 정책' });
      if (items.length) {
        say(LINES.result(m.label));
        items.slice(0, SHOW).forEach(function (it) { list.appendChild(card(it, menu, false)); log({ menu: menu, action: 'recommend', itemId: itemIdOf(it) }); });
        nodes.push(list);
        if (items.length > SHOW) {
          var rest = items.slice(SHOW);
          var more = el('button', { class: 'haru-btn haru-more', type: 'button', text: '더 보기 (' + rest.length + '개)', onclick: function () {
            rest.forEach(function (it) { list.appendChild(card(it, menu, false)); log({ menu: menu, action: 'recommend', itemId: itemIdOf(it) }); });
            more.remove();
            var next = list.children[SHOW] && list.children[SHOW].querySelector('button');
            if (next) next.focus();
          } });
          nodes.push(more);
        }
      } else {
        say(LINES.empty);
      }
      nodes.push(extras(menu, counts));
      nodes.push(footer());
      setBody(nodes);
    }

    // 특정 대상 정책(접힘)과 '조건이 안 맞아 뺀 수'
    function extras(menu, counts) {
      var box = el('div', { class: 'haru-extra' });
      if (counts.special > 0) {
        var holder = el('div');
        var btn = el('button', { class: 'haru-btn haru-special-btn', type: 'button', 'aria-expanded': 'false',
          text: '▸ 특정 대상 정책 ' + counts.special + '개 보기 (장애인·보훈 등)',
          onclick: async function () {
            if (btn.getAttribute('aria-expanded') === 'true') {
              holder.innerHTML = ''; btn.setAttribute('aria-expanded', 'false');
              btn.textContent = '▸ 특정 대상 정책 ' + counts.special + '개 보기 (장애인·보훈 등)';
              return;
            }
            btn.disabled = true;
            var r = await rpc('recommend_programs', { p_menu: menu, p_limit: 10, p_special: true });   // 기록하지 않는다
            btn.disabled = false;
            if (closed) return;
            holder.innerHTML = '';
            if (r.error) { holder.appendChild(el('p', { class: 'haru-muted', text: LINES.failed })); return; }
            holder.appendChild(el('p', { class: 'haru-muted', text: LINES.special }));
            var ul = el('ul', { class: 'haru-list' });
            (r.data || []).forEach(function (it) { ul.appendChild(card(it, menu, true)); });
            holder.appendChild(ul);
            btn.setAttribute('aria-expanded', 'true');
            btn.textContent = '▾ 특정 대상 정책 접기';
          } });
        box.appendChild(btn);
        box.appendChild(holder);
      }
      if (counts.ineligible > 0) {
        box.appendChild(el('p', { class: 'haru-muted', text: '나이·지역 조건이 맞지 않아 뺀 정책이 ' + counts.ineligible + '개 있어요.' }));
      }
      return box.childNodes.length ? box : null;
    }

    // special=true면 기록하지 않고, 신고 버튼도 두지 않는다(무엇을 펼쳤는지 남지 않게)
    function card(it, menu, special) {
      var track = special ? function () {} : function (action) { log({ menu: menu, action: action, itemId: itemIdOf(it) }); };
      var tags = el('p', { class: 'haru-tags' }, [
        el('span', { class: 'haru-tag' + (it.is_local ? ' local' : ''), text: it.is_local ? ((it.region_label || '').split(' ').pop() || '우리 동네') : '전국' }),
        it.online_apply ? el('span', { class: 'haru-tag', text: '온라인 신청' }) : null,
        special && it.target_groups && it.target_groups.length ? el('span', { class: 'haru-tag special', text: '대상: ' + it.target_groups.join(' · ') }) : null
      ]);
      var detail = null;
      var actions = el('div', { class: 'haru-actions' });
      var detailBtn = el('button', { class: 'haru-act secondary', type: 'button', text: '자세히', 'aria-expanded': 'false', onclick: function () {
        if (detail) { detail.remove(); detail = null; detailBtn.setAttribute('aria-expanded', 'false'); detailBtn.textContent = '자세히'; return; }
        detail = detailBox(it);
        li.insertBefore(detail, actions);
        detailBtn.setAttribute('aria-expanded', 'true');
        detailBtn.textContent = '접기';
        track('view');
      } });
      actions.appendChild(detailBtn);

      var url = safeUrl(it.detail_url) || safeUrl(it.homepage);
      var doneBtn = null;
      if (url) {
        actions.appendChild(el('button', { class: 'haru-act', type: 'button', text: '복지로에서 보기', onclick: function () {
          track('apply_click');
          window.open(url, '_blank', 'noopener,noreferrer');
          if (doneBtn) doneBtn.disabled = false;
          say(LINES.opened);
        } }));
        if (!special) {
          doneBtn = el('button', { class: 'haru-act secondary', type: 'button', text: '신청했어요', disabled: true, onclick: function () {
            track('self_reported');
            doneBtn.textContent = '신청했다고 기록했어요';
            doneBtn.disabled = true;
            say(LINES.applied);
          } });
          actions.appendChild(doneBtn);
        }
      }
      if (!special) {
        actions.appendChild(el('button', { class: 'haru-link', type: 'button', text: '정보가 달라요', onclick: function () { reportForm(it, li, actions); } }));
      }

      var li = el('li', { class: 'haru-item', 'data-scope': it.is_local ? 'local' : 'central', 'data-special': special ? '1' : null, 'data-id': it.serv_id }, [
        tags,
        el('p', { class: 'haru-title', text: it.name }),
        it.org ? el('p', { class: 'haru-org', text: it.org }) : null,
        it.summary ? el('p', { class: 'haru-summary', text: it.summary }) : null,
        it.reason ? el('p', { class: 'haru-reason', text: '하루: ' + it.reason }) : null,
        it.age_note ? el('p', { class: 'haru-age', text: '⚠ 나이 조건 확인 — 대상 나이를 복지로에서 꼭 확인해 주세요.' }) : null,
        actions
      ]);
      return li;
    }

    function detailBox(it) {
      var rows = [['지원 대상', it.target_text], ['선정 기준', it.criteria_text], ['지원 내용', it.benefit_text], ['신청 방법', it.apply_text]];
      var dl = el('dl', { style: 'margin:0' });
      rows.forEach(function (r) {
        if (!r[1]) return;
        dl.appendChild(el('dt', { text: r[0] }));
        dl.appendChild(el('dd', { text: r[1] }));
      });
      if (it.contact) { dl.appendChild(el('dt', { text: '문의' })); dl.appendChild(el('dd', null, [contactNode(it.contact)])); }
      var hp = safeUrl(it.homepage);
      if (hp) { dl.appendChild(el('dt', { text: '홈페이지' })); dl.appendChild(el('dd', null, [el('a', { href: hp, target: '_blank', rel: 'noopener noreferrer', text: hp })])); }
      if (!dl.childNodes.length) dl.appendChild(el('dd', { text: '자세한 내용은 복지로에서 확인해 주세요.' }));
      return el('div', { class: 'haru-detail' }, [
        dl,
        el('p', { class: 'haru-checked', text: (it.last_checked ? '복지로 기준 ' + it.last_checked + ' 확인 · ' : '') + '최종 자격은 복지로나 담당 기관에서 확인해 주세요.' })
      ]);
    }

    // [정보가 달라요] — 07의 submit_feedback(channel 'haru', kind 'info', 정책 id)
    function reportForm(it, li, actions) {
      var old = li.querySelector('.haru-report');
      if (old) { old.remove(); return; }
      var id = 'haru-report-' + it.serv_id;
      var ta = el('textarea', { id: id, maxlength: '300', rows: '3', placeholder: '예: 신청 기간이 끝났어요 / 링크가 안 열려요' });
      var count = el('p', { class: 'haru-count', text: '0 / 300' });
      var msg = el('div', { class: 'haru-report-msg', 'aria-live': 'polite' });
      var send = el('button', { class: 'haru-act', type: 'button', text: '보내기' });
      var cancel = el('button', { class: 'haru-act secondary', type: 'button', text: '취소', onclick: function () { box.remove(); } });
      ta.addEventListener('input', function () { count.textContent = ta.value.length + ' / 300'; });
      send.addEventListener('click', async function () {
        var text = ta.value.trim();
        if (!text) { msg.textContent = '어떤 점이 다른지 한 줄만 적어 주세요.'; ta.focus(); return; }
        send.disabled = true;
        var r = await rpc('submit_feedback', { p_channel: 'haru', p_kind: 'info', p_place: '지원센터', p_body: text, p_serv_id: it.serv_id });
        if (closed) return;
        var out = r.error ? 'error' : r.data;
        msg.innerHTML = '';
        if (out === 'saved') {
          box.replaceChildren(el('p', { class: 'haru-report-msg', text: LINES.reportSaved }));
          say(LINES.reportSaved);
        } else if (out === 'crisis') {
          box.replaceChildren(el('p', { class: 'haru-report-msg', text: LINES.reportCrisis }), crisisBox());
          say(LINES.reportCrisis);
        } else {
          msg.textContent = out === 'too_many' ? LINES.reportMany : LINES.reportFail;
          send.disabled = out === 'too_many';
        }
      });
      var box = el('div', { class: 'haru-report' }, [
        el('label', { for: id, text: LINES.reportAsk }),
        ta, count,
        el('div', { class: 'haru-actions' }, [send, cancel]),
        msg
      ]);
      li.appendChild(box);
      ta.focus();
    }

    document.addEventListener('keydown', onKey, true);
    document.body.appendChild(backdrop);
    showMenus();
    return { close: close };
  }

  global.Haru = { open: open, _lines: LINES, _menus: MENUS };
})(window);

</script>

<script>
/*
 * 마을 의견함 — 시민 쪽 화면 부품 (07_feedback_chat.sql)
 *
 *   <script src="feedback/feedback.js"><\/script>
 *   Feedback.compose({ sb, channel: 'chief', place: '광장', onDone })  → 의견 쓰기 폼(DOM). 이장 대화창·휴대폰에서 쓴다
 *   Feedback.inbox({ sb, onChange, onCompose })                       → '내 의견함' 목록·대화(DOM). 휴대폰 화면에 붙인다
 *                                                                        onChange(안 읽은 수) — 불러올 때·읽을 때
 *   Feedback.unread(sb)                                                → 안 읽은 운영팀 답이 달린 의견 수(Promise<number>)
 *
 * - 저장·위기 검사·가리기·횟수 제한은 DB 함수가 한다(submit_feedback · reply_my_feedback). 화면은 결과만 보여 준다.
 * - 운영팀 답장은 사람이 쓴 것으로 표시한다("운영팀 · 사람이 직접 쓴 답"). 이장·하루는 전해 주는 역할만.
