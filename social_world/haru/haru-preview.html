const write = (t) => { logBox.textContent += '\n' + t; };
function fakeSb(mode) {
  return {
    rpc: async (fn, a) => {
      await new Promise(r => setTimeout(r, 250));
      if (mode === 'fail') throw new Error('Failed to fetch');
      if (mode === 'noprofile' && fn !== 'submit_feedback') return { data: null, error: { message: 'profile_required' } };
      if (fn === 'recommend_programs') {
        const src = a.p_special ? (S.special[a.p_menu] || []) : (S.data[a.p_menu] || []);
        return { data: src.slice(0, a.p_limit), error: null };
      }
      if (fn === 'program_counts') {
        const c = S.counts[a.p_menu];
        return { data: [{ eligible: c[0], special: c[1], ineligible: c[2] }], error: null };
      }
      if (fn === 'submit_feedback') {
        write('의견 보내기: ' + JSON.stringify(a));
        if (/사라지고 싶|죽고 싶/.test(a.p_body)) return { data: 'crisis', error: null };
        if (a.p_body.indexOf('도배') >= 0) return { data: 'too_many', error: null };
        return { data: 'saved', error: null };
      }
      return { data: null, error: { message: 'unknown ' + fn } };
    },
    from: () => ({ insert: async (row) => { write(JSON.stringify(row)); return { error: null }; } })
  };
}
